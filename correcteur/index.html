<!doctype html>
<!-- TECHNIQUE
Fiche d'identité
- Rôle : corriger vite une fiche de ceinture de calcul posé (Charivari) en tapant son premier calcul, et évaluer les élèves fiche par fiche.
- Quand : en classe, pendant ou après les ceintures, téléphone en main ; le soir sur l'ordinateur pour faire le point.
- Où : téléphone (appli installée, corrigés seuls) ; Classe sur téléphone et ordinateur (corrigés + évaluations).
- Écran n° 1 : la recherche avec le pavé numérique ; le corrigé s'affiche dès qu'une seule fiche correspond.
- Ce qu'il ne fait pas : pas de liste d'élèves à lui (elle vient de Classe › Maths) ; pas de problèmes (Ateliers de problèmes).
Version : voir VERSION (et CACHE dans sw.js, à changer ensemble).
Charte Repères v1 (commun/charte.css), couleur de l'outil --outil-calcul.
Deux modes, un seul fichier :
- appli installée (github.io ou ?mode=app) : corrigés seuls, hors ligne, AUCUN prénom (dépôt public) ; fichiers communs dans ../commun/
- page de Classe (correcteur.html) : + évaluations A/AR/ECA/NA (commun/eval.js, base evals/calcul, clé « Ceinture-Fiche », ex. « Jaune-B ») ; fichiers communs dans outils/
Données : commun/fiches-calcul.js (window.FICHES_CALCUL). Calculs exacts en BigInt (pas d'erreur d'arrondi sur les décimaux).
Historique :
- 2.1.0 (2026-11-15) un « A » sur une fiche valide aussi en A les ceintures précédentes pas encore validées (clé de ceinture seule, ex. « Blanche » : on n'écrit jamais sur les fiches) ;
  réglage « Ceintures d'avant : auto » (localStorage, par appareil, oui par défaut) ; une seule étape à annuler (setMany).
- 2.0.0 (2026-11-15) charte Repères, évaluations dans Classe (filtre par groupe, ceinture acquise, PDF, Ctrl+Z), fiches dans un fichier de données.
- 1.0.0 (2026-11-15) version reçue + installation, bouton Retour, Échap, numéro de version.
-->

<script>
const VERSION = "2.1.0";
const CLASSE_URL = "https://claude.ai/artifact/Fjw3PS19NxsGxkekSUaoZA";
const SOURCE_FICHES = window.FICHES_CALCUL;
const belts = SOURCE_FICHES.trim().split(/\n(?=[A-Z][^\n]*\|)/).map(block => {
  const [head, ...variants] = block.split("\n");
  const [name, color, precision] = head.split("|");
  return {name, color, sheets: variants.map((line, index) => ({
    name, color, label: "ABC"[index] ?? "D",
    printLabel: name === "Brillante" && index === 2 ? "A" : null,
    operations: line.split(";").map(raw => {
      const [expression, rank] = raw.split("@");
      return {expression, rank: Number(rank ?? precision)};
    })
  }))};
});
const sheets = belts.flatMap(belt => belt.sheets);
const get = id => document.getElementById(id);
const first = get("first"), second = get("second"), correction = get("correction");
const glyph = {"+":"+","-":"−","*":"×","/":"÷"};
const places = ["unités","dizaines","centaines","milliers","dizaines de milliers","centaines de milliers"];
const precisionNames = ["unités","dixièmes","centièmes","millièmes"];
const power = n => 10n ** BigInt(n);
const scale = s => s.split(".")[1]?.length ?? 0;
const integer = s => BigInt(s.replace(".", ""));
const scaled = (s, n) => integer(s) * power(n - scale(s));
const spaced = s => s.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
function format(value, decimals = 0, fixed = false, group = true) {
  const sign = value < 0n ? "−" : "";
  const digits = (value < 0n ? -value : value).toString().padStart(decimals + 1, "0");
  const units = decimals ? digits.slice(0, -decimals) : digits;
  let fraction = decimals ? digits.slice(-decimals) : "";
  if (!fixed) fraction = fraction.replace(/0+$/, "");
  return sign + (group ? spaced(units) : units) + (fraction ? "," + fraction : "");
}
const pretty = expression => expression.replace(/\d+(?:\.\d+)?|[+*/-]/g, token =>
  glyph[token] ? " " + glyph[token] + " " : format(integer(token), scale(token), true));
const normalize = input => input.toLowerCase().replace(/\s/g, "").replace(/[x×]/g,"*")
  .replace(/[÷:]/g,"/").replace(/−/g,"-").replace(/,/g,".").replace(/=$/,"");
const parse = expression => expression.split(/([+*/-])/);
function divide(a, b, rank) {
  const divisor = integer(b);
  const digits = a.split(".");
  const fractional = (digits[1] ?? "").padEnd(rank, "0").slice(0, rank);
  const columns = digits[0] + fractional;
  let remainder = 0n, quotient = 0n;
  const steps = [];
  for (let i = 0; i < columns.length; i++) {
    const current = remainder * 10n + BigInt(columns[i]);
    const digit = current / divisor;
    const product = digit * divisor;
    remainder = current - product;
    quotient = quotient * 10n + digit;
    const place = digits[0].length - 1 - i;
    if (steps.length || digit || place <= 0) {
      steps.push({place, current, digit, product, remainder});
    }
  }
  const remainderRank = Math.max(scale(a), rank);
  const rest = scaled(a, remainderRank) - divisor * quotient * power(remainderRank - rank);
  return {quotient, remainder: rest, remainderRank, steps};
}
function stackRow(number, label = "") {
  return "<code>" + number + "</code><small>" + label + "</small>";
}
const rule = '<div class="rule"></div><span></span>';
function solve(operation) {
  const {expression, rank} = operation;
  const [a, op, b, , c] = parse(expression);
  if (op === "/") {
    const {quotient, remainder, remainderRank, steps} = divide(a, b, rank);
    const rankLabel = rank === 1 ? "Au dixième" : rank === 2 ? "Au centième" : "";
    const rows = steps.map(step => {
      const label = step.place < 0 ? precisionNames[-step.place] : places[step.place];
      return "<tr><td>" + [label, step.current, step.digit, step.product, step.remainder].join("</td><td>") + "</td></tr>";
    }).join("");
    return {
      hint: rankLabel,
      answer: format(quotient, rank, true) + "<small>Reste " + format(remainder) +
        (remainderRank ? " " + precisionNames[remainderRank] : "") + "</small>",
      work: '<table class="division"><thead><tr><th>Rang</th><th>À diviser</th><th>Chiffre</th><th>Produit</th><th>Reste</th></tr></thead><tbody>' +
        rows + "</tbody></table><p>" + pretty(a) + " = " + format(quotient, rank, true) +
        " × " + pretty(b) + " + " + format(remainder, remainderRank) + "</p>"
    };
  }
  const d = Math.max(...[a,b,c].filter(Boolean).map(scale));
  const result = op === "*" ? integer(a) * integer(b) :
    scaled(a,d) + (op === "+" ? scaled(b,d) : -scaled(b,d)) + (c ? scaled(c,d) : 0n);
  const raw = (v,n) => format(v,n,true,false);
  const totalDecimals = op === "*" ? scale(a) + scale(b) : d;
  let work;
  if (op === "*") {
    const multiplier = b.replace(".", "");
    let rows = stackRow(integer(a)) + stackRow("× " + integer(b)) + rule;
    if (multiplier.length > 1) {
      rows += [...multiplier].reverse().map((digit, i) =>
        stackRow(integer(a) * BigInt(digit) * power(i), digit + " · " + places[i])).join("") + rule;
    }
    rows += stackRow(result);
    work = '<div class="stack">' + rows + "</div>";
    if (totalDecimals) {
      work += "<p>Replacer la virgule à " + totalDecimals + " chiffre" +
        (totalDecimals > 1 ? "s" : "") + " de la droite → <b>" +
        format(result,totalDecimals,true) + "</b></p>";
    }
  } else {
    work = '<div class="stack">' + stackRow(raw(scaled(a,d),d)) +
      stackRow(glyph[op] + " " + raw(scaled(b,d),d)) +
      (c ? stackRow("+ " + raw(scaled(c,d),d)) : "") + rule + stackRow(raw(result,d)) + "</div>";
  }
  return {answer: format(result,totalDecimals), hint: "", work};
}
let activeInput, shown, store = null, panel = null;
const evalHost = document.createElement("div");
const sheetKey = s => s.name + "-" + s.label;
function show(sheet, scroll = false) {
  if (sheet === shown && !scroll) return;
  shown = sheet;
  correction.hidden = !sheet;
  get("dock").hidden = !sheet;
  markCatalog();
  if (!sheet) { correction.replaceChildren(); return; }
  const heading = '<div class="sheet-title" style="--belt:' + sheet.color + '"><span class="ceint" aria-hidden="true">' + sheet.label + '</span><div><h2>' + title(sheet) +
    "</h2><p>Touche un calcul pour voir les étapes.</p></div></div>";
  const rows = sheet.operations.map((operation, i) => {
    const solved = solve(operation);
    return '<details class="calc"><summary><span class="num">' + (i + 1) + '</span><span class="expr">' + pretty(operation.expression) +
      (solved.hint ? "<small>" + solved.hint + "</small>" : "") + '</span><span class="answer">' + solved.answer + '</span></summary><div class="work">' + solved.work + "</div></details>";
  }).join("");
  correction.innerHTML = heading + rows;
  correction.querySelector(".sheet-title").after(evalHost);
  if (panel) panel.render();
  if (scroll) {
    if (!history.state?.fiche) history.pushState({fiche: 1}, "");
    correction.scrollIntoView({block: "start", behavior: "smooth"});
  }
}
const title = sheet => sheet.name + " · " + sheet.label + (sheet.printLabel ? " (A sur le PDF)" : "");
function exact(expr, query) { return expr === query || expr.split(/[+*/-]/)[0] === query; }
function update() {
  const query = normalize(first.value), extra = normalize(second.value), choices = get("choices");
  choices.replaceChildren();
  const candidates = query ? sheets.filter(s => s.operations[0].expression.startsWith(query)) : [];
  const matches = candidates.filter(s => exact(s.operations[0].expression, query));
  const pool = matches.length ? matches : candidates;
  const ambiguous = pool.length > 1;
  get("second-wrap").hidden = !ambiguous;
  if (!ambiguous) { second.value = ""; if (activeInput === second) activeInput = first; }
  const narrowed = ambiguous && extra ? pool.filter(s => s.operations[1].expression.startsWith(extra)) : pool;
  const found = narrowed.length === 1 && (matches.includes(narrowed[0]) || (ambiguous && extra)) ? narrowed[0] : null;
  show(found);
  get("status").textContent = !query ? "" : !narrowed.length ? "Aucune fiche ne commence par ce calcul." :
    found ? title(found) : narrowed.length > 1 ? narrowed.length + " fiches correspondent." : "Continue la saisie ou ouvre la fiche proposée.";
  if (found) {
    const jump = document.createElement("button");
    jump.className = "choice go"; jump.textContent = "Voir le corrigé ↓";
    jump.onclick = () => show(found, true);
    choices.append(jump);
  } else if (narrowed.length <= 8) {
    for (const sheet of narrowed) {
      const b = document.createElement("button");
      b.className = "choice";
      b.innerHTML = title(sheet) + "<small>" + pretty(sheet.operations[0].expression) + (ambiguous ? " · " + pretty(sheet.operations[1].expression) : "") + "</small>";
      b.onclick = () => show(sheet, true);
      choices.append(b);
    }
  }
}
function markCatalog() {
  for (const b of document.querySelectorAll("#catalog button")) b.setAttribute("aria-current", String(!!shown && b.dataset.k === sheetKey(shown)));
}
function init() {
  activeInput = first;
  for (const field of [first, second]) {
    field.addEventListener("focus", () => activeInput = field);
    field.addEventListener("input", () => { if (field === first) second.value = ""; update(); });
    field.addEventListener("keydown", e => { if (e.key === "Enter" && shown) show(shown, true); });
  }
  for (const key of ["7","8","9","÷","4","5","6","×","1","2","3","−",",","0","⌫","+"]) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = key;
    if (key === "⌫") b.setAttribute("aria-label", "Effacer un caractère");
    if ("÷×−+".includes(key)) b.className = "op";
    b.addEventListener("pointerdown", e => e.preventDefault());
    b.onclick = () => {
      const f = activeInput, start = f.selectionStart, end = f.selectionEnd;
      const from = key === "⌫" && start === end ? Math.max(0, start - 1) : start;
      f.setRangeText(key === "⌫" ? "" : key, from, end, "end");
      f.focus({preventScroll: true});
      f.dispatchEvent(new Event("input"));
    };
    get("keypad").append(b);
  }
  for (const belt of belts) {
    const row = document.createElement("div");
    row.className = "belt"; row.style.setProperty("--belt", belt.color);
    const dot = document.createElement("i"); dot.className = "dot";
    const name = document.createElement("span"); name.textContent = belt.name;
    row.append(dot, name);
    for (const sheet of belt.sheets) {
      const b = document.createElement("button");
      b.textContent = sheet.label; b.dataset.k = sheetKey(sheet);
      b.setAttribute("aria-label", title(sheet));
      b.onclick = () => { get("browse").open = false; show(sheet, true); };
      row.append(b);
    }
    get("catalog").append(row);
  }
  get("reset").onclick = () => { if (history.state?.fiche) history.back(); else newSheet(); };
  addEventListener("popstate", () => newSheet());
  document.addEventListener("keydown", e => { if (e.key === "Escape") get("reset").click(); });
  get("version").textContent = "version " + VERSION;
}
function newSheet() {
  first.value = ""; second.value = "";
  get("browse").open = false;
  update();
  first.focus({preventScroll: true});
  window.scrollTo({top: 0, behavior: "smooth"});
}

/* Évaluations (seulement dans Classe) */
const beltOf = {};
belts.forEach((b, i) => b.sheets.forEach(s => beltOf[sheetKey(s)] = i));
/* Une ceinture est validée si une de ses fiches a « A », ou si elle a été validée automatiquement (clé = nom de la ceinture seul). */
const validated = (b, name) => store.get(b.name, name) === "A" || b.sheets.some(s => store.get(sheetKey(s), name) === "A");
function acquired(name) { /* plus haute ceinture validée */
  for (let i = belts.length - 1; i >= 0; i--) if (validated(belts[i], name)) return i;
  return -1;
}
let autoPrev = true;
try { autoPrev = localStorage.getItem("calcul-auto-precedentes") !== "0"; } catch {}
function onMark(key, name, m) {
  const changes = [{key, name, m}];
  if (m === "A" && autoPrev) for (let i = 0; i < beltOf[key]; i++)
    if (!validated(belts[i], name)) changes.push({key: belts[i].name, name, m: "A"});
  store.setMany(changes);
  if (changes.length > 1) Evals.toast(name + " : " + (changes.length - 1) + " ceinture" + (changes.length > 2 ? "s" : "") + " d’avant validée" + (changes.length > 2 ? "s" : "") + " aussi");
}
function pupils() {
  const b = shown && belts[beltOf[sheetKey(shown)]];
  return store.roster.map(p => {
    const i = acquired(p.name), auto = b && store.get(b.name, p.name) === "A";
    return {...p, info: p.group + (i >= 0 ? " · ceinture " + belts[i].name.toLowerCase() : "") + (auto ? " · " + b.name.toLowerCase() + " validée auto" : "")};
  });
}
async function startEvals() {
  if (MODE_APP) {
    get("evals-app").innerHTML = '<div class="vers-classe"><span>👥 Les évaluations des élèves se font dans <b>Classe</b> › Outils et réglages › Maths.</span><a class="btn petit" href="' + CLASSE_URL + '" target="_blank" rel="noopener">Ouvrir Classe ↗</a></div>';
    return;
  }
  get("back").hidden = false;
  try {
    store = await Evals.start("calcul", VERSION);
    panel = new Evals.Panel(evalHost, {store, key: () => shown && sheetKey(shown), pupils, filters: true, pdf: exportPdf, onMark,
      extra: () => '<button type="button" class="btn petit" data-ev="x" aria-pressed="' + autoPrev + '" title="Un A valide aussi les ceintures d’avant pas encore validées">' + (autoPrev ? "✓" : "✗") + " Ceintures d’avant : " + (autoPrev ? "auto" : "non") + "</button>",
      onExtra: () => { autoPrev = !autoPrev; try { localStorage.setItem("calcul-auto-precedentes", autoPrev ? "1" : "0"); } catch {} }});
  } catch (e) {
    evalHost.innerHTML = '<div class="vers-classe"><span>⚠ Les évaluations n’ont pas pu se charger (base de Classe injoignable).</span><button class="btn petit" type="button" id="retry">↻ Réessayer</button></div>';
    get("retry").onclick = startEvals;
  }
}
function exportPdf() {
  const rows = store.roster.map(p => ({name: p.name, cells: belts.map(b => {
    const l = store.last([b.name].concat(b.sheets.map(sheetKey)), p.name);
    return l ? {m: l.m, t: l.m + " · " + (l.key === b.name ? "auto" : l.key.split("-").pop())} : null;
  })}));
  return Evals.pdf({sections: [{title: "Ceintures de calcul posé", sub: "Dernière évaluation de chaque ceinture (code · fiche, « auto » = validée par une ceinture suivante)", cols: belts.map(b => b.name), rows}],
    filename: "evaluations-ceintures-calcul.pdf", color: "#23914A", colsPerPage: 11});
}

init();
startEvals();
if (MODE_APP && "serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("./sw.js").catch(() => {});
</script>
<script>if (!MODE_APP) document.write('<script src="side-nav.js" defer><\/script>');</script>
