<!doctype html>
<!-- TECHNIQUE
Fiche d'identité
  Rôle : aider les enseignants à repérer vers qui orienter un élève, à se former et à préparer le courrier de l'école pour le médecin.
  Quand : avant ou après une rencontre avec la famille, en conseil de cycle, pour préparer une équipe éducative.
  Où : ordinateur de l'école ou de la maison, téléphone. Page publique sur GitHub Pages, sans compte.
  Écran n° 1 : le répertoire des professionnels, avec la prise en charge visible d'un coup d'œil.
  Ce qu'il ne fait pas : pas de dossier d'élève partagé, pas de diagnostic, pas de compte rendu d'équipe éducative (skill compte-rendu-equipe-educative).
Version : voir VERSION (une seule constante)
Historique :
  - 1.2.0 (2026-11-21) Répertoire : catégories « Soutien aux parents » (LAEP, espace départemental des solidarités, TISF, AED, avec l'accord des parents) et « Mesures du juge des enfants » (AEMO, MJIE). Question « famille démunie ». Se former : section aides administratives / judiciaires. Coordonnées EDS Blain-Nozay et LAEP (Les P'tites Graines, Le Sablier) ajoutées aux réglages existants. Fiche familles : section « Pour vous, les parents » (3 pages).
  - 1.1.0 (2026-11-18) Fiches à imprimer (familles, enseignants) en PDF et Word, dossier fiches/, en tête du Répertoire (section repliable).
  - 1.0.0 (2026-11-18) Répertoire, Questions, Courrier, Se former, Réglages. et CACHE dans sw.js, à changer ensemble.
Publié dans le dépôt outils-classe, dossier orienter/ (appli installable, hors ligne).
Choix techniques :
  - Deux fichiers : index.html (code) et donnees.js (contenu modifiable sans toucher au code).
  - Aucune donnée envoyée sur internet. Réglages et brouillon du courrier en localStorage, sur l'appareil seulement.
  - Le brouillon s'efface automatiquement après N jours (réglable), pour limiter la conservation de données d'élève (RGPD).
  - Une seule source pour les constats : B.rep[id] ("oui" | "non" | "nsp"). « Questions » et « Courrier » lisent et écrivent la même chose.
  - Charte Repères v1 (couleur d'outil : --outil-orienter).
-->

function calculPistes(){
  var sc={},raisons={},doms={};
  tousItems().forEach(function(it){if(!oui(it.id))return;doms[it.dom.id]=1;it.sp.forEach(function(s,k){sc[s]=(sc[s]||0)+(k===0?2:1);(raisons[s]=raisons[s]||[]).push(it)})});
  var nbDom=Object.keys(doms).length;
  if(nbDom>=3){sc.pco=(sc.pco||0)+3;(raisons.pco=raisons.pco||[]);if(B.niveau==="mat"){sc.camsp=(sc.camsp||0)+2;raisons.camsp=raisons.camsp||[]}sc.cmp=(sc.cmp||0)+2;raisons.cmp=raisons.cmp||[]}
  var l=Object.keys(sc).filter(function(id){return id!=="medecin"}).map(function(id){return{id:id,score:sc[id],raisons:raisons[id]||[]}}).sort(function(a,b){return b.score-a.score});
  return{liste:l,nbDom:nbDom,max:l.length?l[0].score:1};
}

    h+='<div class="piste"><span class="tuile p" style="background:'+c.couleur+'">'+ic(c.picto)+'</span><div style="flex:1"><div class="rangee"><b>'+esc(pr.nom)+'</b>'+badges(pr)+'</div><div class="barre" style="width:'+Math.max(12,Math.round(x.score/p.max*100))+'%;margin:6px 0"></div><div class="muted" style="font-size:14px">'+(x.raisons.length?"Pourquoi : "+x.raisons.slice(0,3).map(function(it){return esc(it.c||it.q)}).join(" · "):"Plusieurs domaines sont touchés.")+'</div><button class="btn petit" style="margin-top:6px" data-act="voir-pro" data-id="'+pr.id+'">Voir la fiche</button></div></div>'});
  h+='</div><div class="encadre"><h2>Constats retenus</h2>';
  DOMAINES.forEach(function(d){var l=d.items.filter(function(it){return oui(it.id)});if(!l.length)return;h+='<h4 style="color:'+d.couleur+'">'+d.nom+'</h4><ul>'+l.map(function(it){return"<li>"+esc(it.c||it.q)+"</li>"}).join("")+'</ul>'});

}

function aujourdhui(){return new Date().toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"})}
function donneesLettre(){
  var e=B.eleve,prenom=e.prenom||"l'élève";
  var cons=DOMAINES.map(function(d){return{nom:d.nom,l:d.items.filter(function(it){return it.c&&oui(it.id)}).map(function(it){return it.c})}}).filter(function(x){return x.l.length});
  var aides=AIDES.filter(function(a,i){return B.aides[i]});
  if(B.autresAides.trim())B.autresAides.split(/\n+/).forEach(function(l){if(l.trim())aides.push(l.trim())});
  return{e:e,prenom:prenom,cons:cons,aides:aides};
}
function lettreHTML(){
  var D=donneesLettre(),E=R.ecole,e=D.e,nomComplet=(e.prenom+" "+e.nom).trim()||"[prénom et nom de l'élève]";
  var h='<div class="ent"><div><b>'+esc(E.nom)+'</b><br>'+esc(E.circo)+(E.adresse?'<br>'+esc(E.adresse):"")+(E.tel?'<br>Tél. '+esc(E.tel):"")+(E.mail?'<br>'+esc(E.mail):"")+'</div><div style="text-align:right">'+esc(E.ville)+', le '+aujourdhui()+'<br><br>À l\'attention du médecin<br>de '+esc(nomComplet)+'</div></div>';
  h+='<div class="obj">Objet : observations de l\'école concernant '+esc(nomComplet)+(e.naissance?', né(e) le '+esc(fmtDate(e.naissance)):"")+(e.classe?', classe de '+esc(e.classe):"")+'</div>';
  h+='<p>Madame, Monsieur le Docteur,</p>';
  h+='<p>Nous accueillons '+esc(D.prenom)+(e.classe?' en classe de '+esc(e.classe):"")+'. L\'équipe pédagogique a fait les observations suivantes, que nous souhaitons porter à votre connaissance.</p>';
  if(D.cons.length)D.cons.forEach(function(c){h+='<h3>'+esc(c.nom)+'</h3><ul>'+c.l.map(function(x){return"<li>"+esc(x)+"</li>"}).join("")+'</ul>'});
  else h+='<p><i>[Coche les constats dans la partie « Constats ».]</i></p>';
  if(D.aides.length)h+='<h3>Ce que l\'école a déjà mis en place</h3><ul>'+D.aides.map(function(x){return"<li>"+esc(x)+"</li>"}).join("")+'</ul>';
  if(B.obs.trim())h+='<h3>Observations complémentaires</h3>'+B.obs.trim().split(/\n+/).map(function(l){return"<p>"+esc(l)+"</p>"}).join("");
  if(B.persiste&&D.cons.length)h+='<p>Ces difficultés persistent malgré les aides proposées en classe.</p>';
  h+='<p>'+(B.rencontre?'Nous avons rencontré la famille le '+esc(fmtDate(B.rencontre))+' et lui avons remis ce courrier. ':'Ce courrier a été remis à la famille. ')+'Nous sollicitons votre avis sur la situation de '+esc(D.prenom)+' et sur l\'opportunité d\'examens ou de bilans complémentaires. Nous restons à votre disposition pour échanger avec vous.</p>';
  h+='<p>Veuillez agréer, Madame, Monsieur le Docteur, l\'expression de nos salutations distinguées.</p>';
  h+='<div class="sig"><div>L\'enseignant(e)<br><b>'+esc(e.enseignant)+'</b></div><div>Le directeur<br><b>'+esc(E.directeur)+'</b></div><div>Vu par la famille</div></div>';
  h+='<div class="pied">Document confidentiel, remis à la famille à l\'attention du médecin.</div>';
  return h;
}
function lettreTexte(){var d=document.createElement("div");d.innerHTML=lettreHTML();d.querySelectorAll("li").forEach(function(li){li.textContent="- "+li.textContent});d.querySelectorAll("p,h3,li,.obj,.ent>div,.sig>div,.pied").forEach(function(x){x.append("\n")});return d.innerText.replace(/\n{3,}/g,"\n\n").trim()}
function vueCourrier(){
  var e=B.eleve,ttl=0;
  var h='<div class="bandeau-brouillon">'+ic("info")+'<div style="flex:1">Brouillon enregistré <b>sur cet appareil seulement</b>, jamais sur internet.'+(R.expire>0?' Il s\'efface tout seul après '+R.expire+' jours.':"")+'</div><button class="btn petit danger" data-act="effacer-b">'+ic("poubelle")+'Effacer</button></div>';
  h+='<div class="deux"><div>';
  h+=sec("c-eleve","L'élève","#2453C7","groupe",'<div class="grille2">'+champ("prenom","Prénom",e.prenom)+champ("nom","Nom",e.nom)+champ("naissance","Date de naissance",e.naissance,"date")+champ("classe","Classe",e.classe)+champ("enseignant","Enseignant(e)",e.enseignant)+champ("rencontre","Rencontre avec la famille",B.rencontre,"date")+'</div>',"");
  DOMAINES.forEach(function(d){var its=itemsNiveau(B.niveau).filter(function(it){return it.dom.id===d.id&&it.c});if(!its.length)return;var n=its.filter(function(it){return oui(it.id)}).length;ttl+=n;
    h+=sec("c-"+d.id,d.nom,d.couleur,d.picto,its.map(function(it){return '<label class="coche"><input type="checkbox" data-cons="'+it.id+'" '+(oui(it.id)?"checked":"")+'><span>'+esc(it.c)+'</span></label>'}).join(""),n?'<span class="badge info compte">'+n+'</span>':"")});
  var na=Object.keys(B.aides).filter(function(k){return B.aides[k]}).length;
  h+=sec("c-aides","Ce que l'école a déjà mis en place","#0F8F6C","ecole",AIDES.map(function(a,i){return '<label class="coche"><input type="checkbox" data-aide="'+i+'" '+(B.aides[i]?"checked":"")+'><span>'+esc(a)+'</span></label>'}).join("")+'<div class="champ" style="margin-top:8px"><label for="autresAides">Autres aides (une par ligne)</label><textarea id="autresAides" data-champ="autresAides">'+esc(B.autresAides)+'</textarea></div>',na?'<span class="badge info compte">'+na+'</span>':"");
  h+=sec("c-obs","Observations libres","#7C3AED","crayon",'<div class="champ"><label for="obs">Un exemple concret, un résultat (fluence, repères), ce que dit l\'élève</label><textarea id="obs" data-champ="obs" rows="5">'+esc(B.obs)+'</textarea></div><label class="coche"><input type="checkbox" data-act="persiste" '+(B.persiste?"checked":"")+'><span>Ajouter « Ces difficultés persistent malgré les aides proposées en classe. »</span></label>',"");
  h+='</div><div class="apercu-col"><div class="rangee" style="margin-bottom:10px"><button class="btn plein" data-act="imprimer">'+ic("imprimer")+'Imprimer</button><button class="btn" data-act="word">'+ic("telecharger")+'Word</button><button class="btn" data-act="copier">'+ic("copier")+'Copier</button></div><div class="papier" id="apercu">'+lettreHTML()+'</div><p class="muted" style="font-size:14px">Le courrier ne nomme aucun spécialiste : il décrit et demande l\'avis du médecin.</p></div></div>';
  return h;
}
function champ(k,l,v,type){return '<div class="champ"><label for="f-'+k+'">'+l+'</label><input id="f-'+k+'" type="'+(type||"text")+'" data-eleve="'+k+'" value="'+esc(v)+'" autocomplete="off"></div>'}
function sec(id,titre,couleur,picto,corps,extra){var ouvert=SEC[id]!==undefined?SEC[id]:(id==="c-eleve"||id==="r-ecole"||id==="f-parcours");return '<details class="sec" data-sec="'+id+'" style="--c:'+couleur+'" '+(ouvert?"open":"")+'><summary><span class="tuile p" style="background:'+couleur+'">'+ic(picto)+'</span>'+titre+(extra||"")+'</summary><div class="int">'+corps+'</div></details>'}
function majApercu(){var a=document.getElementById("apercu");if(a)a.innerHTML=lettreHTML()}

/* ---------- Se former ---------- */
function vueFormer(){
  var h='<div class="outils-sec"><button class="btn petit" data-act="tout" data-v="1">Tout déplier</button><button class="btn petit" data-act="tout" data-v="0">Tout replier</button></div>';
  FORMATION.forEach(function(f){h+=sec("f-"+f.id,f.titre,f.couleur,"former",f.html,"")});
  return h;
}

/* ---------- Réglages ---------- */
function vueReglages(){
  var E=R.ecole;
  var h='<div class="outils-sec"><button class="btn petit" data-act="tout" data-v="1">Tout déplier</button><button class="btn petit" data-act="tout" data-v="0">Tout replier</button></div>';
  h+=sec("r-ecole","École (en-tête du courrier)","#2453C7","ecole",'<div class="grille2">'+[["nom","Nom de l'école"],["circo","Circonscription"],["ville","Ville"],["directeur","Directeur ou directrice"],["adresse","Adresse"],["tel","Téléphone"],["mail","Courriel"]].map(function(x){return '<div class="champ"><label>'+x[1]+'</label><input data-ecole="'+x[0]+'" value="'+esc(E[x[0]])+'"></div>'}).join("")+'</div>',"");
  var opts=PROS.filter(function(p){return p.cat!=="dispositif"&&p.cat!=="justice"}).map(function(p){return[p.id,p.nom]});
  h+=sec("r-contacts","Coordonnées près de chez nous","#7C3AED","tel",'<p class="muted">Elles s\'affichent dans les fiches du répertoire et sur les fiches pour les familles.</p>'+R.contacts.map(function(c,i){return '<div class="ligne-contact"><div class="grille2"><div class="champ"><label>Pour</label><select data-contact="'+i+'" data-k="pro">'+opts.map(function(o){return '<option value="'+o[0]+'" '+(o[0]===c.pro?"selected":"")+'>'+esc(o[1])+'</option>'}).join("")+'</select></div>'+["nom","adresse","tel","mail"].map(function(k){return '<div class="champ"><label>'+{nom:"Nom",adresse:"Adresse",tel:"Téléphone",mail:"Courriel"}[k]+'</label><input data-contact="'+i+'" data-k="'+k+'" value="'+esc(c[k])+'"></div>'}).join("")+'</div><button class="btn petit danger" data-act="suppr-contact" data-i="'+i+'">'+ic("poubelle")+'Supprimer</button></div>'}).join("")+'<button class="btn doux" data-act="ajout-contact">'+ic("plus")+'Ajouter des coordonnées</button>',"");
  h+=sec("r-brouillon","Brouillon du courrier","#B03A48","fichier",'<div class="champ"><label for="expire">Effacer automatiquement le brouillon après</label><select id="expire">'+[[7,"7 jours"],[30,"30 jours"],[90,"90 jours"],[0,"Jamais"]].map(function(o){return '<option value="'+o[0]+'" '+(R.expire===o[0]?"selected":"")+'>'+o[1]+'</option>'}).join("")+'</select></div><p class="muted">Le brouillon contient des informations sur un élève : le garder le moins longtemps possible.</p><button class="btn danger" data-act="effacer-b">'+ic("poubelle")+'Effacer le brouillon maintenant</button>',"");
  h+=sec("r-app","Apparence","#64748B","reglages",'<div class="champ"><label for="th">Thème</label><select id="th"><option value="auto">Automatique</option><option value="light">Clair</option><option value="dark">Sombre</option></select></div>',"");
  h+=sec("r-sauv","Sauvegarde des réglages","#0F8F6C","telecharger",'<p class="muted">Pour copier les réglages (école, coordonnées) sur un autre appareil ou chez un collègue. Le brouillon n\'est pas inclus.</p><div class="rangee"><button class="btn" data-act="export">'+ic("telecharger")+'Exporter</button><label class="btn">'+ic("plus")+'Importer<input type="file" accept=".json" id="imp" hidden></label><button class="btn danger" data-act="reinit">Remettre les réglages d\'origine</button></div>',"");
  h+=sec("r-info","À propos","#475166","info",'<p>Version '+VERSION+'. Informations vérifiées en novembre 2026 (ameli.fr, sante.fr, monparcourshandicap.gouv.fr, service-public.fr). Les prises en charge peuvent évoluer : en cas de doute, vérifier.</p><p class="muted">Raccourcis : Ctrl+Z annule, Ctrl+Maj+Z rétablit. Dans « Questions » : O, N, S.</p>',"");
  return h;
}

/* ---------- Impression ---------- */
function imprimer(html){var z=document.getElementById("impression");z.innerHTML=html;setTimeout(function(){window.print()},50)}
function ficheFamille(id){
  var p=pro(id),E=R.ecole,c=COUTS[p.cout],cls={ok:"g",info:"b",warn:"o",bad:"r"};
  var oc=ordoCls(p.ordo);oc=oc==="neutre"?"b":cls[oc];
  var h='<div class="fiche"><div class="ent">'+esc(E.nom)+' · '+esc(E.ville)+'</div><h1>'+esc(p.nom)+'</h1><p style="font-size:17px">'+esc(p.famille)+'</p>';
  h+='<div class="pastilles"><div class="'+cls[c.cls]+'">'+esc(c.txt)+'</div><div class="'+oc+'">'+esc(p.ordo)+'</div></div>';
  h+='<p><b>Combien ça coûte ?</b> '+esc(p.coutTxt)+'</p>';
  if(p.acces&&p.acces.length)h+='<h2>Comment faire ?</h2><ol>'+p.acces.map(function(x){return"<li>"+esc(x)+"</li>"}).join("")+'</ol>';
  if(p.delai)h+='<p><b>Délai :</b> '+esc(p.delai)+'. Mieux vaut faire les démarches tôt.</p>';
  var cs=contactsDe(id);if(cs.length)h+='<h2>Coordonnées</h2>'+cs.map(function(x){return '<div class="cadre"><b>'+esc(x.nom)+'</b>'+(x.adresse?'<br>'+esc(x.adresse):"")+(x.tel?'<br>Téléphone : '+esc(x.tel):"")+(x.mail?'<br>'+esc(x.mail):"")+'</div>'}).join("");
  if(p.lien)h+='<div class="cadre">'+esc(p.lien.txt)+' : '+esc(p.lien.url)+'</div>';
  return h+'</div>';
}

/* ---------- Rendu ---------- */
const VUES={repertoire:vueRepertoire,questions:vueQuestions,courrier:vueCourrier,former:vueFormer,reglages:vueReglages};
function rendre(){
  rendreCadre();
  document.getElementById("vue").innerHTML=VUES[S.vue]();
  var th=document.getElementById("th");if(th)th.value=R.theme;
  var ch=document.getElementById("cherche");if(ch){ch.oninput=function(){S.cherche=ch.value;var pos=ch.selectionStart;rendre();var n=document.getElementById("cherche");n.focus();n.setSelectionRange(pos,pos)}}
}

/* ---------- Événements ---------- */
document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-tab],[data-act],[data-filtre]");if(!t)return;
  if(t.dataset.tab){aller(t.dataset.tab);return}
  if(t.dataset.filtre){S.filtre=t.dataset.filtre;rendre();return}
  var a=t.dataset.act,v=t.dataset.v;
  if(a==="annuler")annuler();
  else if(a==="fiche")imprimer(ficheFamille(t.dataset.id));
  else if(a==="voir-pro"){S.filtre="tous";S.cherche="";aller("repertoire");var d=document.querySelector('[data-pro="'+t.dataset.id+'"]');if(d){d.open=true;d.scrollIntoView({block:"start"})}}
  else if(a==="q-niveau"){avant();B.niveau=v;sauverB();aller("questions",{etape:"domaines",i:0})}
  else if(a==="q-etape")aller("questions",{etape:v,i:0});
  else if(a==="q-dom"){avant();var k=B.domaines.indexOf(v);if(k>=0)B.domaines.splice(k,1);else B.domaines.push(v);sauverB();rendre()}
  else if(a==="q-commencer")aller("questions",{etape:"q",i:0});
  else if(a==="q-reprendre"){var L=listeQ(),j=L.findIndex(function(it){return !B.rep[it.id]});aller("questions",{etape:L.length?"q":"domaines",i:j<0?0:j})}
  else if(a==="q-rep")repondre(v);
  else if(a==="q-prec")aller("questions",{etape:"q",i:Math.max(0,S.q.i-1)});
  else if(a==="q-resultat")aller("questions",{etape:"resultat",i:0});
  else if(a==="q-recommencer"){if(confirm("Effacer toutes les réponses aux questions ? Les constats cochés dans le courrier seront aussi décochés.")){avant();B.rep={};B.domaines=[];sauverB();aller("questions",{etape:"niveau",i:0})}}
  else if(a==="tab-courrier")aller("courrier");
  else if(a==="effacer-b"){if(brouillonVide()){toast("Le brouillon est déjà vide");return}if(confirm("Effacer le brouillon du courrier (élève, constats, aides, observations) sur cet appareil ?")){avant();B=defautB();try{localStorage.removeItem(CLE_B)}catch(e){}rendre();toast("Brouillon effacé. Ctrl+Z pour annuler.")}}
  else if(a==="imprimer")imprimer('<div class="papier">'+lettreHTML()+'</div>');
  else if(a==="word")telechargerWord();
  else if(a==="copier")copierTexte();
  else if(a==="tout"){document.querySelectorAll("details.sec").forEach(function(d){d.open=v==="1";SEC[d.dataset.sec]=v==="1"});try{localStorage.setItem(CLE_SEC,JSON.stringify(SEC))}catch(e){}}
  else if(a==="ajout-contact"){R.contacts.push({pro:"cmp",nom:"",adresse:"",tel:"",mail:""});sauverR();SEC["r-contacts"]=true;rendre()}
  else if(a==="suppr-contact"){var c=R.contacts[+t.dataset.i];if(confirm("Supprimer les coordonnées « "+(c.nom||"sans nom")+" » ?")){R.contacts.splice(+t.dataset.i,1);sauverR();rendre()}}
  else if(a==="export")exporter();
  else if(a==="reinit"){if(confirm("Remettre l'école et les coordonnées d'origine ? Tes modifications seront perdues.")){R=defautR();sauverR();theme();rendre();toast("Réglages d'origine remis")}}
});
document.addEventListener("change",function(ev){
  var t=ev.target;
  if(t.dataset.cons){avant();if(t.checked)B.rep[t.dataset.cons]="oui";else delete B.rep[t.dataset.cons];sauverB();var s=t.closest("details");majCompte(s);majApercu()}
  else if(t.dataset.aide!==undefined){avant();if(t.checked)B.aides[t.dataset.aide]=true;else delete B.aides[t.dataset.aide];sauverB();majCompte(t.closest("details"));majApercu()}
  else if(t.dataset.act==="persiste"){avant();B.persiste=t.checked;sauverB();majApercu()}
  else if(t.id==="th"){R.theme=t.value;sauverR();theme()}
  else if(t.id==="expire"){R.expire=+t.value;sauverR();rendre()}
  else if(t.dataset.contact!==undefined&&t.tagName==="SELECT"){R.contacts[+t.dataset.contact][t.dataset.k]=t.value;sauverR()}
  else if(t.id==="imp"&&t.files[0]){t.files[0].text().then(function(x){R=migrerR(JSON.parse(x));sauverR();theme();rendre();toast("Réglages importés")}).catch(function(){toast("Fichier illisible")})}
});
var dernierAvant=0;
document.addEventListener("input",function(ev){
  var t=ev.target;
  if(t.dataset.eleve||t.dataset.champ){if(Date.now()-dernierAvant>1500){avant();dernierAvant=Date.now()}
    if(t.dataset.eleve==="rencontre")B.rencontre=t.value;else if(t.dataset.eleve)B.eleve[t.dataset.eleve]=t.value;else B[t.dataset.champ]=t.value;sauverB();majApercu()}
  else if(t.dataset.ecole){R.ecole[t.dataset.ecole]=t.value;sauverR()}
  else if(t.dataset.contact!==undefined){R.contacts[+t.dataset.contact][t.dataset.k]=t.value;sauverR()}
});
document.addEventListener("toggle",function(ev){var d=ev.target;if(d.dataset&&d.dataset.sec){SEC[d.dataset.sec]=d.open;try{localStorage.setItem(CLE_SEC,JSON.stringify(SEC))}catch(e){}}},true);
document.addEventListener("keydown",function(ev){
  var champ=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==="z"&&!champ){ev.preventDefault();if(ev.shiftKey)refaire();else annuler();return}
  if(S.vue==="questions"&&S.q.etape==="q"&&!champ&&!ev.ctrlKey&&!ev.metaKey){var k=ev.key.toLowerCase();if(k==="o")repondre("oui");else if(k==="n")repondre("non");else if(k==="s")repondre("nsp")}
});
function majCompte(d){if(!d)return;var n=d.querySelectorAll("input[type=checkbox]:checked").length,s=d.querySelector("summary"),b=s.querySelector(".compte");if(b)b.remove();if(n)s.insertAdjacentHTML("beforeend",'<span class="badge info compte">'+n+'</span>')}
function repondre(v){var L=listeQ(),it=L[S.q.i];if(!it)return;avant();B.rep[it.id]=v;sauverB();if(S.q.i<L.length-1)aller("questions",{etape:"q",i:S.q.i+1});else aller("questions",{etape:"resultat",i:0})}

/* ---------- Fichiers ---------- */
function nomFichier(){var e=B.eleve;return("courrier_medecin_"+(e.prenom||"eleve")+(e.nom?"_"+e.nom:"")).replace(/[^\wÀ-ÿ-]+/g,"_")}
function telechargerWord(){
  var css="body{font-family:Arial,sans-serif;font-size:11pt}h3{font-size:12pt;color:#1F3864;margin:12pt 0 4pt}.ent{width:100%}.sig td{border:1px solid #9AA9C2;height:70pt;vertical-align:top;text-align:center;width:33%}.pied{font-size:9pt;color:#555;text-align:center}";
  var d=document.createElement("div");d.innerHTML=lettreHTML();
  var ent=d.querySelector(".ent");if(ent){var c=ent.children;ent.outerHTML='<table class="ent"><tr><td style="vertical-align:top">'+c[0].innerHTML+'</td><td style="text-align:right;vertical-align:top">'+c[1].innerHTML+'</td></tr></table>'}
  var sg=d.querySelector(".sig");if(sg){sg.outerHTML='<table class="sig" style="width:100%;border-collapse:collapse;margin-top:18pt"><tr>'+Array.prototype.map.call(sg.children,function(x){return"<td>"+x.innerHTML+"</td>"}).join("")+'</tr></table>'}
  var html='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><style>'+css+'</style></head><body>'+d.innerHTML+'</body></html>';
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿",html],{type:"application/msword"}));a.download=nomFichier()+".doc";document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000);toast("Courrier téléchargé");
}
function copierTexte(){var t=lettreTexte();if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){toast("Texte copié")},function(){repli(t)});else repli(t)}
function repli(t){var x=document.createElement("textarea");x.value=t;document.body.appendChild(x);x.select();try{document.execCommand("copy");toast("Texte copié")}catch(e){toast("Copie impossible")}x.remove()}
function exporter(){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(R,null,2)],{type:"application/json"}));a.download="orienter-reglages.json";document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000)}

/* ---------- Démarrage ---------- */
(function(){var h=location.hash.slice(1);if(VUES[h])S.vue=h})();
history.replaceState({vue:S.vue,q:S.q},"","#"+S.vue);
theme();rendre();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(function(){});
</script>
