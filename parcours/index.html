<!doctype html>
<!-- TECHNIQUE
Fiche d'identité
  Nom : Parcours élève (widget personnalisé pour Grist, grist.numerique.gouv.fr).
  Rôle : suivre le parcours et les aides de chaque élève de l'école, à plusieurs, sans classeur papier.
  Quand : avant ou après un entretien avec les parents, une EE ou une ESS ; en conseil des maîtres ou de cycle ; à la rentrée (import ONDE) ; en fin d'année (bilan annuel).
  Où : ordinateurs de l'école et de la maison (téléphone pour consulter). Page publique sur GitHub Pages, SANS aucune donnée d'élève : les données vivent dans le document Grist, hébergé par l'État.
  Écran n° 1 : les alertes et la recherche d'élève, puis les élèves classe par classe.
  Ce qu'il ne fait pas : PPRE / PAP / PPS officiels (le LPI), annuaire pour orienter et informations préoccupantes (Boussole élève, dossier orienter/), rédaction des comptes rendus (skill compte-rendu-equipe-educative).
Version : voir VERSION dans app-events.js (une seule constante)
Historique :
  - 0.3.0 (2026-11-28) Suivis : type de suivi puis nom dans la liste filtrée de l'annuaire, états sans « Demandé », dates selon l'état, fréquence en liste. Rencontres : cartes réduites + mêmes cases que Parcours. Accueil : listes PAI, MDPH, PPS, PAP, PPRE, allophones. Les tables existantes sont complétées (colonnes ajoutées) par « Installer / compléter ».
  - 0.2.1 (2026-11-28) Pièces jointes : l'envoi depuis le widget est bloqué (« Failed to fetch »), remplacé par un guide pour joindre le fichier dans la table Rencontres de Grist ; lecture des fichiers conservée.
  - 0.2.0 (2026-11-28) Accueil (recherche, alertes, classes, archivés), fiche élève (Résumé, Parcours, Suivis, Rencontres avec pièces jointes, MDPH et PAI), Réglages repliables, Ctrl+Z, installation déplacée dans Réglages.
  - 0.1.0 (2026-11-28) Installation : crée les tables, listes et réglages dans le document Grist, remplit l'annuaire des professionnels depuis orienter/donnees.js. Ne supprime et ne remplace jamais rien.
Choix techniques :
  - Fichiers : index.html (page et styles), schema.js (structure des tables et listes), app-data.js (lecture, écriture, annulation, installation), app-ui.js (écrans), app-events.js (événements, démarrage).
  - Pas de confirm() ni d'alert() : le widget est dans une iframe de Grist qui peut les bloquer ; suppression en deux touches.
  - Les dates Grist sont en secondes (minuit UTC). Les listes à choix multiples s'écrivent ["L", ...].
  - Plusieurs utilisateurs : dernière écriture gagnante par champ ; relecture douce toutes les 30 s.
  - Accès « complet au document » demandé à Grist (nécessaire pour créer les tables).
  - RGPD : données de santé -> jamais de Google, jamais d'IA sur du texte nominatif, rien dans ce dépôt public. Avertir le DPD de l'académie avant de saisir de vraies données.
  - Colonnes de liens (Ref) : l'affichage du nom de l'élève est tenté à l'installation ; le widget n'en dépend pas (il relie par numéro de ligne).
  - Charte Repères v1 (commun/charte.css).
-->
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Parcours élève</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="../commun/charte.css">
<style>
:root{--outil:#0F766E}
@media (prefers-color-scheme:dark){:root{--outil:#4FD1C5}}
main{width:min(100% - 20px,860px);margin:0 auto;padding:8px 0 80px}
h2{margin:0 0 8px;font-size:1.15rem}h3{margin:0 0 8px;font-size:1rem}
.entete{padding:10px 0}.entete .bar{display:flex;align-items:center;gap:10px}
.barre{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}.barre .titre{flex:1;font-weight:700;min-width:0}
.carte{margin-top:10px}details.carte>summary{min-height:var(--cible);display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer;margin:-14px;padding:0 14px}
details.carte[open]>summary{margin-bottom:6px}
input,select,textarea{width:100%;min-height:44px;border:1px solid var(--trait);border-radius:var(--arrondi-m);background:var(--surface);padding:8px 10px}
textarea{resize:vertical}
.grille>.chip{align-self:end;justify-self:start}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.ch{display:flex;flex-direction:column;gap:4px}.ch.large{grid-column:1/-1}.lab{font-size:.85rem;color:var(--encre-douce);font-weight:700}
.chips,.pj{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--trait);background:var(--surface-2);font-weight:700}
.chip[aria-pressed=true],.seg button[aria-pressed=true]{background:var(--outil);border-color:var(--outil);color:var(--sur-outil)}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:var(--arrondi-m);background:var(--surface-2)}.seg button{min-width:48px;min-height:44px;border:0;border-radius:9px;background:transparent;font-weight:700}
.pastille{display:inline-block;font-size:.78rem;font-weight:700;border-radius:8px;padding:1px 8px;background:color-mix(in srgb,var(--outil) 14%,var(--surface));color:var(--encre)}
.pastille.ok{background:#E3F2E8;color:#1E6B3A}.pastille.orange{background:#FDF0DC;color:#8A4B00}.pastille.rouge{background:#FBE4E2;color:#9B1C14}
@media (prefers-color-scheme:dark){.pastille.ok{background:#1E3A2A;color:#9BE2B3}.pastille.orange{background:#3A2E14;color:#F5C97A}.pastille.rouge{background:#3F1D1A;color:#FFB4AB}}
.eleve{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:52px;padding:6px 4px;border-top:1px solid var(--trait);color:inherit;text-decoration:none}
.eleve:hover{background:var(--surface-2)}.pastilles{display:flex;gap:6px;margin-left:auto}
.alerte{display:block;padding:8px 10px;margin-top:6px;border-radius:var(--arrondi-m);color:inherit;text-decoration:none;border-left:5px solid #B45309;background:var(--surface-2)}.alerte.n0{border-left-color:#B42318}
.entete-eleve{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;justify-content:space-between}.actions{display:flex;gap:8px;flex-wrap:wrap}
.onglets{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px}
.onglets button{flex:none;min-height:44px;padding:0 14px;border-radius:var(--arrondi-m);border:1px solid var(--trait);background:var(--surface);font-weight:700}
.onglets button[aria-selected=true]{background:var(--outil);border-color:var(--outil);color:var(--sur-outil)}
.btn.danger{color:var(--danger)}
.sous{border-top:1px solid var(--trait);margin-top:8px;padding-top:2px}.sous>summary{min-height:44px;display:flex;align-items:center;font-weight:700;cursor:pointer}
.aidepj{margin-top:8px;padding:10px 12px;border-radius:var(--arrondi-m);background:var(--surface-2);border:1px solid var(--trait)}.aidepj p{margin:0 0 4px}.aidepj ol{margin:0 0 8px;padding-left:20px}
pre{white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--trait);border-radius:var(--arrondi-m);padding:10px;max-height:260px;overflow:auto;font-size:.85rem}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--encre);color:var(--fond);padding:10px 16px;border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;z-index:9}
.bandeau{padding:10px 12px;border-radius:var(--arrondi-m);background:#FDF0DC;color:#8A4B00;margin-top:12px}
@media print{.noprint,.entete,#toast{display:none!important}body{background:#fff}.carte{box-shadow:none;break-inside:avoid}}
</style></head><body>
<header class="entete"><main style="padding:0">
  <div class="bar"><span class="tuile" style="display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--outil);color:var(--sur-outil)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg></span>
  <b style="font-size:1.2rem">Parcours élève</b><small class="aide" id="ver"></small></div>
</main></header>
<main><div id="horsgrist" class="bandeau" hidden>Cette page est faite pour s'ouvrir <b>dans Grist</b> (widget personnalisé). Ouverte seule, elle ne peut rien faire.</div><div id="app"></div></main>
<div id="toast" role="status"></div>
<script src="schema.js"></script><script src="app-data.js"></script><script src="app-ui.js"></script><script src="app-events.js"></script>
</body>
</html>
