<!-- TECHNIQUE
15/11/2026 : colonne commune de Classe (side-nav.js) à gauche sur ordinateur, effacée en projection (body.proj) ; liens de la barre du haut masqués.
Fiche d'identité :
  Rôle : placer les élèves sur les tables de la salle selon des règles (séparer, éloigner, tutorat, mixité F/G, CM1/CM2, places imposées, rotation des voisins).
  Quand : préparer à la maison ou en classe ; projeter au TBI ; imprimer pour le classeur du remplaçant.
  Où : ordi maison, ordi de classe / TBI, téléphone (retouches).
  Écran n° 1 : le plan actif, bouton « 🎲 Placer les élèves ».
  Ce qu'il ne fait pas : les groupes de travail (groupes.html), les profils d'élèves (onglet Élèves de Groupes), la fluence (lecture.html).
Version : constante VERSION ci-dessous.
  1.6 (21/11/2026) : un seul fichier pour Classe (plan.html) et le kit « Outils de classe partagés » (dépôt outils-classe, plan/index.html) ;
       dans le kit : élèves de « Ma classe », données sur l'appareil (commun/kit-db.js imite la base), barre Outils / Ma classe / Groupes / Plan de classe.
  1.5 (14/11/2026) : charte « Repères » : Atkinson Hyperlegible, couleurs de la charte (CM1 vert, CM2 orange), en-tête bleu pâle, barre des pages de Classe.
  1.4 (10/11/2026) : placement à la main plus simple : glisser-déposer à la souris ou au stylet (un élève vers une place, ou un prénom « À placer » vers une place ; au doigt : toucher puis toucher) ;
       correctif : sur un appareil neuf, le plan de départ n'était pas complété et « 🎲 » plantait ;
       ce qui est placé à la main est figé 🔒 automatiquement (réglage aff.fige, Oui par défaut) pour que « 🎲 » place les autres autour ; « 🧹 Vider » (tout, ou en gardant les 🔒).
  1.3 (09/11/2026) : places imposées multiples (fixes{sid:[z]}) + « centre » (face au tableau) ; gauchers (gauche{sid:1}, R.gauche) ; onglet 📝 Fiches : fiche élève PDF (jsPDF cdnjs, 2 A5 par A4, fcfg), saisie fiches{sid:{bav,vue,place,main,aide[],aider[],mal[],bien[]}}, « Appliquer » → bav, fixes, gauche, nivx{sid:{comp:f|a}}, liens (f:1), tutorats ; R.avis = si-absent|prio|ign.
  1.2 (09/11/2026) : plusieurs tutorats (R.tutos[{id,comp,m,w}]) ; bavardage par élève (D.bav{sid:1 parfois|2 bavard}, absent = calme) + règle R.bav.
  1.1 (09/11/2026) : oral = grands (g) / petits (p) parleurs → « pas deux grands parleurs côte à côte » ; ⚠️ = comportement → « loin les uns des autres » (ou jamais voisins).
  1.0 (09/11/2026) : première version.
Données :
  lit  lecture/main (state.students : id, n prénom, g CM1/CM2…, p groupe de fluence 1-4) et lecture/groupes (eleves[sid] : s f|g, o g|n|p, c:1 ⚠️, k{comp:niveau} ; comps ; sep ✂️) : lecture seule.
  écrit lecture/plan (privé, règle « lecture » = admin) : {v, ts, salles[], plans[], actif, R règles, fixes{sid:z}, liens[], hist[], aff}
        lecture/planfond-<idSalle> : {img dataURL JPEG ≤ 240 Ko, ts} (photo ou dessin en fond de la salle).
  copie locale : localStorage classe-plan-v1 (+ -meta {dirty,lastDb}, -secours, -eleves).
Géométrie : 1 unité = 1 place (largeur 1, profondeur 0,8). Tables : ind, duo, trio, il4, il6 ; x,y = centre, r = degrés ; res:1 = place à part (pas remplie sauf 📌 « place à part »).
  Voisins = distance entre places ≤ 1,25 (poids 1) ; devant/derrière ≤ 1,9 (poids 0,35). « Loin » = distance < R.loinD.
Algorithme : coût pondéré (importance 1 souhaitée = 4, 2 importante = 15, 3 obligatoire = 300) + recuit simulé par échanges, 6 essais, garde le meilleur. Places 🔒 jamais déplacées.
Synchro : affichage immédiat de la copie locale, puis la base ; la plus récente gagne ; si les deux ont changé, fenêtre de choix avec les dates. Jamais d'envoi de l'état par défaut si la copie locale est illisible.
Impression : window.print est bloqué dans les artéfacts → image PNG via la capacité downloads.
-->

<script>
var VERSION = "1.6";
var LKEY = "classe-plan-v1";
var U = 60;                 // unités SVG par place
var PW = 1, PD = 0.8;       // largeur, profondeur d'une place
var WT = {0:0, 1:4, 2:15, 3:300};
var IMP = [[1,"Souhaitée"],[2,"Importante"],[3,"Obligatoire"]];
var TYPES = {ind:{c:1,r:1,t:"Individuelle"}, duo:{c:2,r:1,t:"Table de 2"}, trio:{c:3,r:1,t:"Table de 3"}, il4:{c:2,r:2,t:"Îlot de 4"}, il6:{c:3,r:2,t:"Îlot de 6"}};
var OBJ = {tab:{t:"Tableau",w:5,h:0.3}, bur:{t:"Bureau",w:1.8,h:0.9}, porte:{t:"Porte",w:1.2,h:0.25}, fen:{t:"Fenêtres",w:4,h:0.2}, txt:{t:"Coin",w:2,h:1}};
var FIXES = [["devant","👓 Près du tableau"],["centre","🎯 Face au tableau"],["fond","🔙 Au fond"],["bureau","🧑‍🏫 Près du bureau"],["porte","🚪 Près de la porte"],["apart","🏝️ Place à part"]];
var DOMK = {lect:"Lire", ecr:"Écrire", calc:"Calculer", pb:"Problèmes", orga:"M'organiser", angl:"Anglais", auto:"Travailler seul", coop:"Travailler en groupe", num:"Ordinateur", dess:"Dessin, schéma", crea:"Créer, inventer"};
function fxArr(sid){ var v=D.fixes[sid]; return !v ? [] : (Array.isArray(v) ? v : [v]); }

var D = null;          // données du plan
var EL = {list:[], by:{}, comps:[], sep:[]};
var UI = {vue:"plan", sel:null, selSeat:null, pick:null, eleve:false, zoom:1, edit:null, lienSel:[], lienT:"loin", lienW:2, lastIssues:[], hi:{}, fonds:{}, fondReq:{}};
var SY = {db:null, ref:null, dirty:false, lastDb:0, gotDb:false, localBad:false, writing:false, again:false, timer:null, ro:false, conflict:false};

/* ---------- utilitaires ---------- */
function uid(){ return Math.random().toString(36).slice(2,9); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function toast(t){ var el=document.getElementById("toast"); el.textContent=t; el.style.opacity=1; clearTimeout(el._t); el._t=setTimeout(function(){el.style.opacity=0;},2600); }
function fmtD(ts){ if(!ts) return "—"; var d=new Date(ts); return d.toLocaleDateString("fr-FR",{day:"numeric",month:"short"})+" "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}); }
function r1(x){ return Math.round(x*10)/10; }
function snap(v){ return Math.round(v*4)/4; }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

/* ---------- modèles de salle ---------- */
function T(k,x,y,r){ return {id:uid(), k:k, x:x, y:y, r:r||0, res:0}; }
function O(k,x,y,w,h,r){ return {id:uid(), k:k, x:x, y:y, w:w, h:h, r:r||0, t:""}; }
function salleModele(m,n){
  var t=[], W=12, H=10, i, nom="Salle", k, rows;
  n = n || 26;
  if(m==="rangees2"){ nom="Rangées par 2"; k=Math.ceil(n/2); rows=Math.ceil(k/3); H=Math.max(8, 3.2+rows*1.8); for(i=0;i<k;i++) t.push(T("duo",[2.2,6,9.8][i%3], 3.2+Math.floor(i/3)*1.8)); }
  else if(m==="rangees3"){ nom="Rangées par 3"; W=13; k=Math.ceil(n/3); rows=Math.ceil(k/3); H=Math.max(8,3.2+rows*1.8); for(i=0;i<k;i++) t.push(T("trio",[2.1,6.5,10.9][i%3], 3.2+Math.floor(i/3)*1.8)); }
  else if(m==="u" || m==="ucentre"){
    nom = m==="u" ? "En U" : "En U + tables de 2 au centre";
    k = Math.ceil(n/2); var centre = 0;
    if(m==="ucentre"){ centre = Math.max(2, Math.round(k*0.35)); k -= centre; }
    var side = Math.ceil(k/3), bottom = Math.max(0, k-2*side);
    W = Math.max(12, 2.8 + bottom*2.1 + 1.6);
    H = 3 + side*2.1 + 1.4;
    for(i=0;i<side;i++){ t.push(T("duo",0.9, 3.4+i*2.1, 90)); t.push(T("duo",W-0.9, 3.4+i*2.1, 90)); }
    for(i=0;i<bottom;i++) t.push(T("duo", (W-(bottom-1)*2.1)/2 + i*2.1, H-0.9, 0));
    for(i=0;i<centre;i++) t.push(T("duo", W/2 + (i%2? 1.3 : -1.3), 3.6+Math.floor(i/2)*1.8));
  }
  else if(m==="ilots4"){ nom="Îlots de 4"; k=Math.ceil(n/4); rows=Math.ceil(k/3); H=Math.max(8,3.4+rows*2.8); for(i=0;i<k;i++) t.push(T("il4",[2.2,6,9.8][i%3], 3.6+Math.floor(i/3)*2.8)); }
  else if(m==="ilots6"){ nom="Îlots de 6"; W=13; k=Math.ceil(n/6); rows=Math.ceil(k/3); H=Math.max(8,3.4+rows*2.8); for(i=0;i<k;i++) t.push(T("il6",[2.4,6.5,10.6][i%3], 3.6+Math.floor(i/3)*2.8)); }
  else { nom="Salle vide"; }
  var o=[O("tab",W/2,0.35,Math.min(6,W-3),0.3), O("bur",W-1.6,1.5,1.8,0.9), O("porte",0.9,0.2,1.2,0.25)];
  return {id:uid(), nom:nom, W:r1(W), H:r1(H), t:t, o:o, fond:{on:0, op:0.45}};
}
var MODELES = [["rangees2","▭▭","Rangées par 2"],["rangees3","▭▭▭","Rangées par 3"],["u","⊔","En U"],["ucentre","⊔▭","U + tables de 2 au centre"],["ilots4","⊞","Îlots de 4"],["ilots6","⊞⊞","Îlots de 6"],["vide","□","Salle vide"]];

/* ---------- données ---------- */
function defRegles(){ return {sepG:2, loinD:3, sexe:{m:"mix",w:1}, niv:{m:"mix",w:1}, oral:{m:"gg",w:2}, alerte:{m:"loin",w:2}, rv:3, tutos:[{id:"t1",comp:"lect",m:"tuto",w:1}], bav:{m:"sep",w:2}, gauche:{m:"on",w:1}, avis:"absent", rot:{n:2,w:1}}; }
function defaut(){
  var s = salleModele("rangees2", 26);
  var p = {id:uid(), nom:"Plan 1", salle:s.id, d:Date.now(), a:{}, lk:{}};
  return {v:1, ts:0, salles:[s], plans:[p], actif:p.id, R:defRegles(), fixes:{}, liens:[], hist:[], aff:{niv:1, sexe:0, taille:1, theme:"auto", fige:1}};
}
function migrer(d){
  var base = defaut();
  if(!d || typeof d!=="object") return base;
  var o = Object.assign({}, base, d);

  SY.writing = true; var ts = D.ts;
  SY.ref.set(clone(D)).then(function(){
    SY.writing=false; SY.lastDb = ts; if(D.ts===ts) SY.dirty=false; metaSauver(); majSync();

    else if(e && e.code==="quota_exceeded"){ toast("Base pleine : enregistrement impossible."); }

function recevoirBase(snap){
  SY.gotDb = true;
  if(!snap.exists){
    if(SY.localBad){ majSync(); return; }               // jamais d'état par défaut vers la base
    if(SY.dirty || D.ts) planifierEcriture();
    majSync(); return;
  }
  var data = snap.data(); var dts = data.ts||0;
  if(dts === D.ts){ SY.lastDb = dts; SY.dirty=false; metaSauver(); majSync(); return; }
  if(snap.metadata && snap.metadata.hasPendingWrites) return;
  if(SY.conflict) return;
  if(!SY.dirty){ D = migrer(clone(data)); SY.lastDb = dts; SY.localBad=false; sauverLocal(); rendre(); return; }   // la base fait foi
  if(dts === SY.lastDb){ planifierEcriture(); majSync(); return; }   // la base n'a pas bougé : on envoie nos changements
  conflit(data);                                                     // les deux ont changé : on demande
}

/* ---------- géométrie ---------- */
function rot(x,y,deg){ var a=deg*Math.PI/180, c=Math.cos(a), s=Math.sin(a); return [x*c-y*s, x*s+y*c]; }

  var out=[];

    var ty=TYPES[t.k]||TYPES.duo, d=dimT(t), n=0;
    for(var j=0;j<ty.r;j++) for(var i=0;i<ty.c;i++){

function dist(a,b){ var dx=a.x-b.x, dy=a.y-b.y; return Math.sqrt(dx*dx+dy*dy); }
function rangs(seats, objs){
  // rang 0 = le plus proche des objets donnés (0..1) ; null si aucun objet

  var d = seats.map(function(s,i){ var m=1e9; objs.forEach(function(o){ var v=Math.hypot(s.x-o.x, s.y-o.y); if(v<m) m=v; }); return [m,i]; });

  var r = new Array(seats.length); d.forEach(function(x,k){ r[x[1]] = k/(seats.length-1); });
  return r;
}

function rangsLat(seats, tabs, salle){
  if(seats.length<2) return seats.map(function(){return 0;});
  var t=tabs[0], ux=1, uy=0, cx=salle.W/2, cy=0;
  if(t){ var a=(t.r||0)*Math.PI/180; ux=Math.cos(a); uy=Math.sin(a); cx=t.x; cy=t.y; }
  var d=seats.map(function(s,i){ return [Math.abs((s.x-cx)*ux+(s.y-cy)*uy), i]; });

/* ---------- moteur ---------- */
function pairKey(a,b){ return a<b ? a+"|"+b : b+"|"+a; }
function prep(salle){

function cout(c, A, detail){

function tableauA(c, plan){
  var A = new Array(c.n).fill(-1);
  c.S.forEach(function(s,i){ var sid=plan.a[s.id]; if(sid && c.ix[sid]!=null) A[i]=c.ix[sid]; });
  // élève placé deux fois (données anciennes) : on garde la première place
  var vu={}; for(var i=0;i<A.length;i++){ if(A[i]<0) continue; if(vu[A[i]]) A[i]=-1; else vu[A[i]]=1; }
  return A;
}
function optimiser(plan, salle){
  var c = prep(salle), n=c.n, nE=c.E.length;
  var A0 = tableauA(c, plan), lk = plan.lk || {};
  var fixe = c.S.map(function(s,i){ return !!lk[s.id] && A0[i]>=0; });
  var placed={}; A0.forEach(function(a,i){ if(fixe[i]) placed[a]=1; else A0[i]=-1; });
  var M=[]; for(var i=0;i<n;i++) if(!fixe[i]) M.push(i);
  if(!M.length) return {A:A0, c:c};
  var best=null, bestC=1e18;
  var essais=6, iters=Math.min(20000, 3000+ M.length*400);
  for(var e=0;e<essais;e++){
    var A=A0.slice();
    var apart=[], autres=[]; for(var s=0;s<nE;s++){ if(placed[s]) continue; (c.fx[s].indexOf("apart")>=0?apart:autres).push(s); }
    shuffle(apart); shuffle(autres);
    var resS=M.filter(function(i){return c.S[i].res;}), norm=shuffle(M.filter(function(i){return !c.S[i].res;}));
    shuffle(resS);
    apart.forEach(function(s){ var k=resS.length?resS.shift():norm.shift(); if(k!=null) A[k]=s; });
    autres.forEach(function(s){ var k=norm.length?norm.shift():resS.shift(); if(k!=null) A[k]=s; });
    var cur=cout(c,A), T=Math.max(10,cur*0.05), Tend=0.05, alpha=Math.pow(Tend/T, 1/iters);
    var bA=A.slice(), bC=cur;
    for(var it=0;it<iters;it++){
      var x=M[(Math.random()*M.length)|0], y=M[(Math.random()*M.length)|0];
      if(x===y || (A[x]<0 && A[y]<0)) { T*=alpha; continue; }
      var t=A[x]; A[x]=A[y]; A[y]=t;
      var nc=cout(c,A);
      if(nc<=cur || Math.random()<Math.exp((cur-nc)/T)){ cur=nc; if(cur<bC){ bC=cur; bA=A.slice(); } }
      else { t=A[x]; A[x]=A[y]; A[y]=t; }
      T*=alpha;
    }
    if(bC<bestC){ bestC=bC; best=bA; }
  }
  return {A:best, c:c, cost:bestC};
}

function nonPlaces(plan){
  var pl={}; Object.keys(plan.a).forEach(function(k){ pl[plan.a[k]]=1; });
  var S=sieges(salleA()), ids={}; S.forEach(function(s){ ids[s.id]=1; });
  Object.keys(plan.a).forEach(function(k){ if(!ids[k]) delete pl[plan.a[k]]; });
  return EL.list.filter(function(e){ return !pl[e.id]; });
}
function nettoyerPlan(plan){
  var S=sieges(salleDe(D,plan)), ids={}; S.forEach(function(s){ ids[s.id]=1; });
  Object.keys(plan.a).forEach(function(k){ if(!ids[k] || !EL.by[plan.a[k]] && EL.list.length) delete plan.a[k]; });
  Object.keys(plan.lk).forEach(function(k){ if(!plan.a[k]) delete plan.lk[k]; });
}

function blocAnalyse(plan, salle){
  if(!Object.keys(plan.a).length || !EL.list.length) return "";
  var c=prep(salle), A=tableauA(c,plan), out=cout(c,A,true);
  out.sort(function(a,b){ return b.w-a.w; });
  UI.lastIssues = out.map(function(o){ return o.s.map(function(i){ return c.S[i].id; }); });
  var h=["<div class='card noproj'><h2>Règles</h2>"];
  var nO=out.filter(function(o){return o.w===3;}).length;
  h.push(nO ? "<p style='color:var(--danger);font-weight:600'>"+nO+" règle(s) obligatoire(s) non respectée(s)</p>" : "<p class='ok'>✅ Toutes les règles obligatoires sont respectées.</p>");
  var cnt=out.cnt, R=D.R, lines=[];
  function ligne(ic, lab, r, k){ if(r.m==="ign" || !cnt[k][1]) return; var ok=cnt[k][1]-cnt[k][0]; lines.push(ic+" "+lab+" : "+ok+" paire"+(ok>1?"s":"")+" de voisins sur "+cnt[k][1]+" "+(r.m==="mix"?"mélangées":"regroupées")); }
  ligne("👧👦","Filles / garçons",R.sexe,"sexe"); ligne("🎓","CM1 / CM2",R.niv,"niv");
  if(R.oral.m==="mix") ligne("🗣️","Grands / petits parleurs",R.oral,"oral");
  if(R.oral.m==="gg") lines.push("🗣️ Grands parleurs côte à côte : "+cnt.oral[0]);
  if(R.bav.m==="sep") lines.push("💬 Deux bavards 🔴 côte à côte : "+cnt.bav[0]+" · 🔴/🟠 ou 🟠/🟠 : "+cnt.bav[1]);
  if(lines.length) h.push("<p class='small'>"+lines.join("<br>")+"</p>");
  if(out.length){
    h.push("<p class='muted small'>Touche une ligne pour voir les places concernées.</p><ul class='issues'>");
    out.slice(0,40).forEach(function(o,i){ h.push("<li class='"+(o.w===3?"o":o.w===2?"i":"s")+"' data-iss='"+i+"'>"+esc(o.txt)+" <span class='muted small'>· "+IMP[o.w-1][1].toLowerCase()+"</span></li>"); });
    h.push("</ul>");
  }
  h.push("</div>");
  return h.join("");
}

/* ---------- éditeur de salle ---------- */
function ptSvg(svg, e){ var pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY; var m=svg.getScreenCTM(); if(!m) return {x:0,y:0}; var p=pt.matrixTransform(m.inverse()); return {x:p.x/U, y:p.y/U}; }
function lierEditeur(svg){
  var drag=null;
  svg.addEventListener("pointerdown", function(e){
    var g=e.target.closest("[data-t],[data-o]"); if(!g){ if(UI.sel){ UI.sel=null; rendre(); } return; }
    var id=g.dataset.t||g.dataset.o, salle=salleE(), it=(g.dataset.t?salle.t:salle.o).filter(function(x){return x.id===id;})[0]; if(!it) return;
    var p=ptSvg(svg,e); drag={it:it, g:g, dx:p.x-it.x, dy:p.y-it.y, x0:it.x, y0:it.y, moved:false};
    try{ svg.setPointerCapture(e.pointerId); }catch(x){} e.preventDefault();
  });
  svg.addEventListener("pointermove", function(e){
    if(!drag) return; var p=ptSvg(svg,e), s=salleE();
    var nx=Math.max(0,Math.min(s.W, snap(p.x-drag.dx))), ny=Math.max(0,Math.min(s.H, snap(p.y-drag.dy)));
    if(Math.abs(nx-drag.x0)+Math.abs(ny-drag.y0)>0.2) drag.moved=true;
    if(nx!==drag.it.x || ny!==drag.it.y){ drag.it.x=nx; drag.it.y=ny; drag.g.setAttribute("transform","translate("+nx*U+" "+ny*U+") rotate("+(drag.it.r||0)+")"); }
  });
  function fin(){ if(!drag) return; var d=drag; drag=null; if(d.moved){ UI.sel=d.it.id; modifie(); } else UI.sel = UI.sel===d.it.id ? null : d.it.id; rendre(); }
  svg.addEventListener("pointerup", fin); svg.addEventListener("pointercancel", fin);
}

/* ---------- photo de fond ---------- */
function chargerFond(file){
  var url=URL.createObjectURL(file), img=new Image();
  img.onload=function(){
    var max=1400, w=img.naturalWidth, h=img.naturalHeight, k=Math.min(1,max/Math.max(w,h));
    var cv=document.createElement("canvas"); cv.width=Math.round(w*k); cv.height=Math.round(h*k);
    var cx=cv.getContext("2d"); cx.fillStyle="#fff"; cx.fillRect(0,0,cv.width,cv.height); cx.drawImage(img,0,0,cv.width,cv.height);
    URL.revokeObjectURL(url);
    var q=0.7, data=cv.toDataURL("image/jpeg",q);
    while(data.length>240000 && q>0.25){ q-=0.1; data=cv.toDataURL("image/jpeg",q); }
    if(data.length>240000){ var c2=document.createElement("canvas"); c2.width=Math.round(cv.width*0.6); c2.height=Math.round(cv.height*0.6); c2.getContext("2d").drawImage(cv,0,0,c2.width,c2.height); data=c2.toDataURL("image/jpeg",0.5); }
    var s=salleE(); UI.fonds[s.id]=data; s.fond.on=1;
    var ratio=h/w; modal("<h3>📷 Image ajoutée</h3><p>Adapter la profondeur de la salle aux proportions de l'image ("+s.W+" × "+r1(s.W*ratio)+" places) ?</p><div class='row'><button class='btn pri' data-act='f-ratio' data-r='"+ratio+"'>Oui, adapter</button><button class='btn' data-act='mclose'>Non</button></div>");
    if(SY.db) SY.db.doc("lecture/planfond-"+s.id).set({img:data, ts:Date.now()}).catch(function(){ toast("Image non enregistrée dans la base (elle reste affichée ici)."); });
    modifie(); rendre();
  };
  img.onerror=function(){ toast("Image illisible : essaie une photo JPEG ou PNG."); };
  img.src=url;
}
function chargerFondBase(id){
  if(!SY.db || UI.fondReq[id]) return; UI.fondReq[id]=1;
  SY.db.doc("lecture/planfond-"+id).get().then(function(s){ if(s.exists && s.data().img){ UI.fonds[id]=s.data().img; rendre(); } }).catch(function(){ UI.fondReq[id]=0; });
}

      "<p class='muted small'>Ce que tu as déjà réglé toi-même (bavardage, places) est gardé. Les règles venues des fiches sont marquées 📝 dans 🎯 Règles ; tu peux les supprimer une par une. Tu peux relancer après de nouvelles fiches.</p>"+
      "<button class='btn pri' data-act='f-apply'>Appliquer au plan</button></div>");
  }
  return h.join("");
};
function bilanFiches(){
  var n={bav:0,vue:0,g:0,aide:0,aider:0,mal:0,bien:0,f:0};
  EL.list.forEach(function(e){ var f=D.fiches[e.id]; if(!f) return; n.f++;
    if(f.bav>0 && D.bav[e.id]==null) n.bav++; if(f.vue>=1) n.vue++; if(f.main==="g") n.g++;
    n.aide+=(f.aide||[]).length; n.aider+=(f.aider||[]).length; n.mal+=(f.mal||[]).length; n.bien+=(f.bien||[]).length; });
  var l=[n.f+" fiche(s) saisie(s)"];
  if(n.bav) l.push("💬 "+n.bav+" élève(s) se disent bavards (parfois ou souvent)");
  if(n.vue) l.push("👓 "+n.vue+" élève(s) voient mal le tableau → près du tableau (et face au tableau si « non »)");
  if(n.g) l.push("✍️ "+n.g+" gaucher(s)");
  if(n.aide||n.aider) l.push("🧑‍🏫 "+n.aide+" demandes d'aide, "+n.aider+" propositions d'aider → tutorats");
  if(n.mal) l.push("↔️ "+n.mal+" « loin de » → règles « loin » (importantes)");
  if(n.bien) l.push("🤝 "+n.bien+" « bien avec » → règles « côte à côte » (souhaitées)");
  return {n:n, lignes:l};
}
function appliquerFiches(){
  D.liens = D.liens.filter(function(l){ return !l.f; });
  var mal={}, bien={};
  EL.list.forEach(function(e){ var f=D.fiches[e.id]; if(!f) return;
    if(f.bav>0 && D.bav[e.id]==null) D.bav[e.id]=f.bav;
    if(f.vue>=1){ var a=fxArr(e.id).filter(function(z){return z!=="fond";}); if(a.indexOf("devant")<0) a.push("devant"); if(f.vue===2 && a.indexOf("centre")<0) a.push("centre"); D.fixes[e.id]=a; }
    if(f.main==="g") D.gauche[e.id]=1; else if(f.main==="d") delete D.gauche[e.id];
    var nx={}; (f.aider||[]).forEach(function(c){ nx[c]="a"; }); (f.aide||[]).forEach(function(c){ nx[c]="f"; });
    if(Object.keys(nx).length) D.nivx[e.id]=nx; else delete D.nivx[e.id];
    (f.mal||[]).forEach(function(o){ if(EL.by[o]) mal[pairKey(e.id,o)]=[e.id,o]; });
    (f.bien||[]).forEach(function(o){ if(EL.by[o]) bien[pairKey(e.id,o)]=[e.id,o]; });
  });
  Object.keys(mal).forEach(function(k){ D.liens.push({id:uid(), t:"loin", m:mal[k], w:2, f:1}); });
  Object.keys(bien).forEach(function(k){ if(!mal[k]) D.liens.push({id:uid(), t:"ens", m:bien[k], w:1, f:1}); });
  var ajout=[];
  domsFiche().forEach(function(c){
    var f=0, a=0; Object.keys(D.nivx).forEach(function(s){ if(D.nivx[s][c]==="f") f++; if(D.nivx[s][c]==="a") a++; });
    if(f && a && !D.R.tutos.some(function(t){return t.comp===c;})){ D.R.tutos.push({id:uid(), comp:c, m:"tuto", w:1}); ajout.push(domLbl(c)); }
  });
  modifie(); rendre();
  toast("Réponses appliquées."+(ajout.length?" Tutorats ajoutés : "+ajout.join(", ")+".":"")+" Touche 🎲 dans 🪑 Plan.");
}
function ouvrirFiche(sid){
  var e=EL.by[sid]; if(!e) return; UI.ficheSid=sid;
  var f=D.fiches[sid]||{}, cfg=D.fcfg, h=["<h3>📝 "+esc(e.n)+"</h3>"];
  FQ.forEach(function(q){ if(!cfg[q[0]]) return;
    h.push("<p class='lbl' style='margin:10px 0 4px;font-weight:600'>"+esc(q[1])+"</p><div class='chips'>"+q[2].map(function(o){ return "<button class='chip"+(f[q[0]]===o[0]?" on":"")+"' data-fs='"+q[0]+"|"+o[0]+"'>"+esc(o[1])+"</button>"; }).join("")+"</div>"); });
  if(cfg.aide){ var ds=domsFiche();
    h.push("<p style='margin:10px 0 4px;font-weight:600'>J'ai besoin d'aide en…</p><div class='chips'>"+ds.map(function(d){ return "<button class='chip"+((f.aide||[]).indexOf(d)>=0?" on":"")+"' data-fs='aide|"+d+"'>"+esc(domLbl(d))+"</button>"; }).join("")+"</div>");
    h.push("<p style='margin:10px 0 4px;font-weight:600'>Je peux aider en…</p><div class='chips'>"+ds.map(function(d){ return "<button class='chip"+((f.aider||[]).indexOf(d)>=0?" on":"")+"' data-fs='aider|"+d+"'>"+esc(domLbl(d))+"</button>"; }).join("")+"</div>"); }
  [["mal","Je dois être loin de…"],["bien","Je travaille bien avec…"]].forEach(function(q){ if(!cfg[q[0]]) return;
    h.push("<p style='margin:10px 0 4px;font-weight:600'>"+q[1]+" <span class='muted small'>(2 au plus)</span></p><div class='chips'>"+EL.list.filter(function(o){return o.id!==sid;}).map(function(o){ return "<button class='chip"+((f[q[0]]||[]).indexOf(o.id)>=0?" on":"")+"' data-fs='"+q[0]+"|"+o.id+"'>"+esc(o.n)+"</button>"; }).join("")+"</div>"); });
  var i=EL.list.indexOf(e), nx=EL.list[i+1];
  h.push("<div class='row' style='margin-top:14px'>"+(nx?"<button class='btn pri' data-fedit='"+nx.id+"'>Suivant : "+esc(nx.n)+" ▶</button>":"")+"<button class='btn' data-act='f-close'>Terminer</button>"+(D.fiches[sid]?"<button class='btn danger' data-act='f-del'>Effacer sa fiche</button>":"")+"</div>");
  var box=document.getElementById("mbox"), st=(document.getElementById("modal").hidden || UI.ficheLast!==sid)?0:box.scrollTop;
  modal(h.join("")); box.scrollTop=st; UI.ficheLast=sid;
}
function ficheClic(v){
  var sid=UI.ficheSid, q=v.split("|"), k=q[0], val=q[1], f=D.fiches[sid]||{};
  if(k==="bav"||k==="vue") val=+val;
  if(["aide","aider","mal","bien"].indexOf(k)>=0){
    var arr=(f[k]||[]).slice(), j=arr.indexOf(val);
    if(j>=0) arr.splice(j,1); else { if((k==="mal"||k==="bien") && arr.length>=2){ toast("2 prénoms au plus."); return; } arr.push(val); if(k==="aide"||k==="aider"){ var o=k==="aide"?"aider":"aide"; f[o]=(f[o]||[]).filter(function(x){return x!==val;}); } }
    f[k]=arr;
  } else f[k] = f[k]===val ? null : val;
  f.d=Date.now(); D.fiches[sid]=f; modifie(); ouvrirFiche(sid);
}
function chargerJsPDF(){
  return new Promise(function(ok,ko){
    if(window.jspdf && window.jspdf.jsPDF) return ok(window.jspdf.jsPDF);
    var sc=document.createElement("script"); sc.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
    sc.onload=function(){ window.jspdf ? ok(window.jspdf.jsPDF) : ko(); }; sc.onerror=ko; document.head.appendChild(sc);
  });
}
function ficheDessin(doc, ox, e){
  var cfg=D.fcfg, x0=ox+9, W=130, y=15, i;
  doc.setTextColor(0); doc.setDrawColor(60); doc.setLineWidth(0.3);
  doc.setFont("helvetica","bold"); doc.setFontSize(14); doc.text("Ma place en classe", x0, y);
  doc.setFontSize(13); doc.text(e ? e.n : "Prénom : ..................", x0+W, y, {align:"right"});
  y+=5.5; doc.setFont("helvetica","normal"); doc.setFontSize(8.5); doc.setTextColor(90);
  doc.text("Coche une seule case par ligne. Réponds franchement : cela m'aide à bien te placer.", x0, y); doc.setTextColor(0);
  y+=7.5;
  FQ.forEach(function(q){ if(!cfg[q[0]]) return;
    doc.setFont("helvetica","bold"); doc.setFontSize(10.5); doc.text(q[1], x0, y); y+=5.5;
    doc.setFont("helvetica","normal"); doc.setFontSize(10); var x=x0+2;
    q[2].forEach(function(o){ doc.rect(x, y-3.6, 4.2, 4.2); doc.text(o[1], x+6, y); x+=6+doc.getTextWidth(o[1])+8; });
    y+=8.5; });
  var ds=domsFiche();
  if(cfg.aide && ds.length){
    var c1=x0+80, c2=x0+113;
    doc.setFont("helvetica","bold"); doc.setFontSize(10.5); doc.text("Coche si c'est vrai :", x0, y);
    doc.setFontSize(9); doc.text("J'ai besoin d'aide", c1, y, {align:"center"}); doc.text("Je peux aider", c2, y, {align:"center"}); y+=5.5;
    doc.setFont("helvetica","normal"); doc.setFontSize(10);
    ds.forEach(function(d,k){ if(k%2===0){ doc.setFillColor(242,242,238); doc.rect(x0, y-4.2, W, 5.6, "F"); }
      doc.text(domLbl(d), x0+2, y); doc.rect(c1-2.1, y-3.5, 4.2, 4.2); doc.rect(c2-2.1, y-3.5, 4.2, 4.2); y+=5.6; });
    y+=4;
  }
  var autres=EL.list.filter(function(o){ return !e || o.id!==e.id; });
  var rows=Math.ceil(autres.length/4), lh = rows>8 ? 4.2 : 4.7;
  [["mal","Je dois être loin de :"],["bien","Je travaille bien avec :"]].forEach(function(q){ if(!cfg[q[0]]) return;
    doc.setFont("helvetica","bold"); doc.setFontSize(10.5); doc.text(q[1], x0, y);
    doc.setFont("helvetica","normal"); doc.setFontSize(8.5); doc.setTextColor(90); doc.text("entoure 2 prénoms au plus (ou aucun)", x0+W, y, {align:"right"}); doc.setTextColor(0);
    y+=5; doc.setFontSize(9.5);
    autres.forEach(function(o,k){ doc.text(o.n, x0+2+(k%4)*(W/4), y+Math.floor(k/4)*lh); });
    y+=rows*lh+4; });
  doc.setFontSize(6); doc.setTextColor(160); doc.text(e ? "Plan de classe · "+e.id : "Plan de classe", x0+W, 204, {align:"right"}); doc.setTextColor(0);
}
function pdfFiches(vierge){
  toast("Préparation du PDF…");
  chargerJsPDF().then(function(JsPDF){
    var doc=new JsPDF({orientation:"landscape", unit:"mm", format:"a4"});
    var list = vierge ? [null,null] : EL.list.slice();
    for(var i=0;i<list.length;i+=2){
      if(i) doc.addPage();
      ficheDessin(doc, 0, list[i]);
      if(i+1<list.length) ficheDessin(doc, 148.5, list[i+1]);
      doc.setLineDashPattern([2,2],0); doc.setDrawColor(170); doc.line(148.5, 5, 148.5, 205); doc.setLineDashPattern([],0);
    }
    telecharger(vierge?"fiche-ma-place-vierge.pdf":"fiches-ma-place-en-classe.pdf", doc.output("blob"));
  }).catch(function(){ toast("PDF impossible : vérifie la connexion internet, puis réessaie."); });
}

/* ---------- démarrage ---------- */
function demarrer(){
  metaLire();
  D = chargerLocal();
  if(!D){ D = migrer(defaut()); }   /* v1.4 : plan de départ complété (bav, gauche, fiches…) : sinon « 🎲 » plantait sur un appareil neuf */
  elevesLocal();
  UI.vue = (location.hash||"").slice(1) || "plan"; if(!VUES[UI.vue]) UI.vue="plan";
  try{ history.replaceState({v:UI.vue},"","#"+UI.vue); }catch(e){}
  rendre();
  if(SY.localBad) toast("Copie de cet appareil illisible : elle est gardée en secours, la base fait foi.");
  var slowT = setTimeout(function(){ if(!SY.gotDb){ SY.slow=true; majSync(); } }, 8000);
  if(!window.claude || !window.claude.use){ SY.dbNull=true; majSync(); return; }
  window.claude.use("db").then(function(db){
    if(!db){ SY.dbNull=true; majSync(); return; }
    SY.db=db; SY.ref=db.doc("lecture/plan");
    chargerEleves();
    SY.ref.onSnapshot(function(s){ clearTimeout(slowT); recevoirBase(s); }, function(){ SY.dbNull=true; SY.db=null; majSync(); });
    majSync();
  }).catch(function(){ SY.dbNull=true; majSync(); });
}
document.addEventListener("visibilitychange", function(){ if(document.visibilityState==="visible") chargerEleves(); });
demarrer();
