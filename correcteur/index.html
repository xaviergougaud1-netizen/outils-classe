<!doctype html>
<!-- TECHNIQUE
Fiche d'identité
- Rôle : corriger vite une fiche de ceinture de calcul posé (Charivari) en tapant son premier calcul, et évaluer les élèves fiche par fiche.
- Quand : en classe, pendant ou après les ceintures, téléphone en main ; le soir sur l'ordinateur pour faire le point.
- Où : téléphone (appli installée, corrigés seuls) ; Classe sur téléphone et ordinateur (corrigés + évaluations).
- Écran n° 1 : la recherche avec le pavé numérique ; le corrigé s'affiche dès qu'une seule fiche correspond.
- Ce qu'il ne fait pas : pas de liste d'élèves à lui (elle vient de Classe › Maths) ; pas de problèmes (Ateliers de problèmes).
Version : voir VERSION (et CACHE dans sw.js, à changer ensemble).
Charte Repères v1 (commun/charte.css), couleur de l'outil --outil-calcul.
Deux modes, un seul fichier :
- appli installée (github.io ou ?mode=app) : corrigés seuls, hors ligne, AUCUN prénom (dépôt public) ; fichiers communs dans ../commun/
- page de Classe (correcteur.html) : + évaluations A/AR/ECA/NA (commun/eval.js, base evals/calcul, clé « Ceinture-Fiche », ex. « Jaune-B ») ; fichiers communs dans outils/
Données : commun/fiches-calcul.js (window.FICHES_CALCUL). Calculs exacts en BigInt (pas d'erreur d'arrondi sur les décimaux).
Historique :
- 2.5.0 (2026-11-17) bouton « À passer » (seulement les élèves dont c'est la prochaine ceinture, + ceux déjà évalués sur la fiche ; localStorage « calcul-a-passer ») ;
  « Grille de la classe » (élèves × ceintures, même filtre de groupe que le panneau, case touchée = ouvre la fiche et montre l'élève) ;
  eval.js : « ☑ Plusieurs » pour évaluer plusieurs élèves d'un coup (opts.changes : les ceintures d'avant suivent, une seule étape à annuler).
- 2.4.0 (2026-11-17) corrigé d'abord, liste d'élèves dessous (bouton « Élèves ↓ » dans le titre de la fiche) ;
  chaque élève montre ses ceintures obtenues (12 pastilles de couleur, pleines = obtenues) et « ✓ déjà obtenue » si la ceinture ouverte l'est déjà ;
  multiplication posée avec le nombre le plus long en haut (76 × 9 742 → posée 9 742 × 76, comme les élèves) ;
  eval.js : élèves par ordre alphabétique partout, filtre « CM2 b+c » qui réunit les groupes d'un même niveau (CM2b + CM2c).
- 2.3.0 (2026-11-15) 5 derniers calculs de la calculatrice sous le pavé quand le champ est vide (localStorage « correcteur-derniers-calculs », par appareil) ;
  gardés quand on quitte le calcul (Nouveau calcul, Échap, Entrée, champ vidé, appli mise de côté), touche pour reprendre, « Effacer la liste » confirmé en deux touchers (pas de confirm()) ;
  « Réessayer » des évaluations relié (le bouton n’était pas encore dans la page).
- 2.2.0 (2026-11-15) plus de 2e cadre de saisie (les 2 fiches au même 1er calcul sont proposées en boutons, avec leur 2e calcul) ;
  calculatrice libre : un calcul complet qui n'ouvre aucune fiche affiche son résultat sous le pavé (étapes au toucher),
  division à l'unité, au dixième et au centième avec le reste ; + et − acceptent plusieurs nombres.
- 2.1.0 (2026-11-15) un « A » sur une fiche valide aussi en A les ceintures précédentes pas encore validées (clé de ceinture seule, ex. « Blanche » : on n'écrit jamais sur les fiches) ;
  réglage « Ceintures d'avant : auto » (localStorage, par appareil, oui par défaut) ; une seule étape à annuler (setMany).
- 2.0.0 (2026-11-15) charte Repères, évaluations dans Classe (filtre par groupe, ceinture acquise, PDF, Ctrl+Z), fiches dans un fichier de données.
- 1.0.0 (2026-11-15) version reçue + installation, bouton Retour, Échap, numéro de version.
-->

<script>
const VERSION = "2.5.0";
const CLASSE_URL = "https://claude.ai/artifact/Fjw3PS19NxsGxkekSUaoZA";
const SOURCE_FICHES = window.FICHES_CALCUL;
const belts = SOURCE_FICHES.trim().split(/\n(?=[A-Z][^\n]*\|)/).map(block => {
  const [head, ...variants] = block.split("\n");
  const [name, color, precision] = head.split("|");
  return {name, color, sheets: variants.map((line, index) => ({
    name, color, label: "ABC"[index] ?? "D",
    printLabel: name === "Brillante" && index === 2 ? "A" : null,
    operations: line.split(";").map(raw => {
      const [expression, rank] = raw.split("@");
      return {expression, rank: Number(rank ?? precision)};
    })
  }))};
});
const sheets = belts.flatMap(belt => belt.sheets);
const get = id => document.getElementById(id);
const first = get("first"), correction = get("correction");
const glyph = {"+":"+","-":"−","*":"×","/":"÷"};
const places = ["unités","dizaines","centaines","milliers","dizaines de milliers","centaines de milliers"];
const precisionNames = ["unités","dixièmes","centièmes","millièmes"];
const power = n => 10n ** BigInt(n);
const scale = s => s.split(".")[1]?.length ?? 0;
const integer = s => BigInt(s.replace(".", ""));
const scaled = (s, n) => integer(s) * power(n - scale(s));
const spaced = s => s.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
function format(value, decimals = 0, fixed = false, group = true) {
  const sign = value < 0n ? "−" : "";
  const digits = (value < 0n ? -value : value).toString().padStart(decimals + 1, "0");
  const units = decimals ? digits.slice(0, -decimals) : digits;
  let fraction = decimals ? digits.slice(-decimals) : "";
  if (!fixed) fraction = fraction.replace(/0+$/, "");
  return sign + (group ? spaced(units) : units) + (fraction ? "," + fraction : "");
}
const pretty = expression => expression.replace(/\d+(?:\.\d+)?|[+*/-]/g, token =>
  glyph[token] ? " " + glyph[token] + " " : format(integer(token), scale(token), true));
const normalize = input => input.toLowerCase().replace(/\s/g, "").replace(/[x×]/g,"*")
  .replace(/[÷:]/g,"/").replace(/−/g,"-").replace(/,/g,".").replace(/=$/,"");
const parse = expression => expression.split(/([+*/-])/);
function divide(a, b, rank) {
  const divisor = integer(b);
  const digits = a.split(".");
  const fractional = (digits[1] ?? "").padEnd(rank, "0").slice(0, rank);
  const columns = digits[0] + fractional;
  let remainder = 0n, quotient = 0n;
  const steps = [];
  for (let i = 0; i < columns.length; i++) {
    const current = remainder * 10n + BigInt(columns[i]);
    const digit = current / divisor;
    const product = digit * divisor;
    remainder = current - product;
    quotient = quotient * 10n + digit;
    const place = digits[0].length - 1 - i;
    if (steps.length || digit || place <= 0) {
      steps.push({place, current, digit, product, remainder});
    }
  }
  const remainderRank = Math.max(scale(a), rank);
  const rest = scaled(a, remainderRank) - divisor * quotient * power(remainderRank - rank);
  return {quotient, remainder: rest, remainderRank, steps};
}
function stackRow(number, label = "") {
  return "<code>" + number + "</code><small>" + label + "</small>";
}
const rule = '<div class="rule"></div><span></span>';
function solve(operation) {
  const {expression, rank} = operation;
  const [a, op, b] = parse(expression);
  if (op === "/") {
    const {quotient, remainder, remainderRank, steps} = divide(a, b, rank);
    const rankLabel = rank === 1 ? "Au dixième" : rank === 2 ? "Au centième" : "";
    const rows = steps.map(step => {
      const label = step.place < 0 ? precisionNames[-step.place] : places[step.place];
      return "<tr><td>" + [label, step.current, step.digit, step.product, step.remainder].join("</td><td>") + "</td></tr>";
    }).join("");
    return {
      hint: rankLabel,
      answer: format(quotient, rank, true) + "<small>Reste " + format(remainder) +
        (remainderRank ? " " + precisionNames[remainderRank] : "") + "</small>",
      work: '<table class="division"><thead><tr><th>Rang</th><th>À diviser</th><th>Chiffre</th><th>Produit</th><th>Reste</th></tr></thead><tbody>' +
        rows + "</tbody></table><p>" + pretty(a) + " = " + format(quotient, rank, true) +
        " × " + pretty(b) + " + " + format(remainder, remainderRank) + "</p>"
    };
  }
  /* + et − : autant de nombres qu'on veut (ex. 120 − 35 − 8) */
  const parts = parse(expression), nums = parts.filter((_, i) => i % 2 === 0), signs = parts.filter((_, i) => i % 2);
  const d = Math.max(...nums.map(scale));
  const result = op === "*" ? integer(a) * integer(b) :
    nums.reduce((sum, n, i) => i === 0 ? scaled(n,d) : signs[i - 1] === "-" ? sum - scaled(n,d) : sum + scaled(n,d), 0n);
  const raw = (v,n) => format(v,n,true,false);
  const totalDecimals = op === "*" ? scale(a) + scale(b) : d;
  let work, hint = "";
  if (op === "*") {
    /* Les élèves posent le nombre qui a le plus de chiffres en haut : 76 × 9 742 se pose 9 742 × 76. */
    const swap = b.replace(".", "").length > a.replace(".", "").length;
    const top = swap ? b : a, bottom = swap ? a : b;
    if (swap) hint = "Posée : " + pretty(top + "*" + bottom).trim();
    const multiplier = bottom.replace(".", "");
    let rows = stackRow(integer(top)) + stackRow("× " + integer(bottom)) + rule;
    if (multiplier.length > 1) {
      rows += [...multiplier].reverse().map((digit, i) =>
        stackRow(integer(top) * BigInt(digit) * power(i), digit + " · " + places[i])).join("") + rule;
    }
    rows += stackRow(result);
    work = '<div class="stack">' + rows + "</div>";
    if (totalDecimals) {
      work += "<p>Replacer la virgule à " + totalDecimals + " chiffre" +
        (totalDecimals > 1 ? "s" : "") + " de la droite → <b>" +
        format(result,totalDecimals,true) + "</b></p>";
    }
  } else {
    work = '<div class="stack">' + nums.map((n, i) => stackRow((i ? glyph[signs[i - 1]] + " " : "") + raw(scaled(n,d),d))).join("") +
      rule + stackRow(raw(result,d)) + "</div>";
  }
  return {answer: format(result,totalDecimals), hint, work};
}
let shown, store = null, panel = null;
const evalHost = document.createElement("div");
evalHost.className = "evhost";
const sheetKey = s => s.name + "-" + s.label;
function show(sheet, scroll = false) {
  if (sheet === shown && !scroll) return;
  shown = sheet;
  correction.hidden = !sheet;
  get("dock").hidden = !sheet;
  markCatalog();
  if (!sheet) { correction.replaceChildren(); return; }
  const heading = '<div class="sheet-title" style="--belt:' + sheet.color + '"><span class="ceint" aria-hidden="true">' + sheet.label + '</span><div><h2>' + title(sheet) +
    "</h2><p>Touche un calcul pour voir les étapes.</p></div>" +
    (store ? '<button type="button" class="btn petit" data-goeval title="Aller à la liste des élèves">👥 Élèves ↓</button>' : "") + "</div>";
  const rows = sheet.operations.map((operation, i) => {
    const solved = solve(operation);
    return '<details class="calc"><summary><span class="num">' + (i + 1) + '</span><span class="expr">' + pretty(operation.expression) +
      (solved.hint ? "<small>" + solved.hint + "</small>" : "") + '</span><span class="answer">' + solved.answer + '</span></summary><div class="work">' + solved.work + "</div></details>";
  }).join("");
  correction.innerHTML = heading + rows;
  /* Le corrigé d'abord, la liste des élèves ensuite. */
  correction.append(evalHost);
  const go = correction.querySelector("[data-goeval]");
  if (go) go.onclick = () => evalHost.scrollIntoView({block: "start", behavior: "smooth"});
  if (panel) panel.render();
  if (scroll) {
    if (!history.state?.fiche) history.pushState({fiche: 1}, "");
    correction.scrollIntoView({block: "start", behavior: "smooth"});
  }
}
const title = sheet => sheet.name + " · " + sheet.label + (sheet.printLabel ? " (A sur le PDF)" : "");
function exact(expr, query) { return expr === query || expr.split(/[+*/-]/)[0] === query; }
/* Calculatrice libre : un calcul complet qui n'est pas le 1er d'une fiche.
   Renvoie {html} (résultat + étapes repliées), {error} (calcul complet mais impossible) ou null (saisie pas finie). */
const COMPLETE = /^\d+(\.\d+)?([+*/-]\d+(\.\d+)?)+$/;
function calculator(query) {
  if (!COMPLETE.test(query)) return null;
  const parts = parse(query), signs = parts.filter((_, i) => i % 2);
  if (signs.length > 1 && signs.some(s => s === "*" || s === "/"))
    return {error: "Pour × et ÷, tape un seul calcul à la fois (ex. 47 × 28)."};
  const line = (operation, tag) => {
    const solved = solve(operation);
    return '<details class="calc"><summary><span class="num">=</span><span class="expr">' + pretty(operation.expression) +
      "<small>" + (tag || solved.hint || "Touche pour voir les étapes") + '</small></span><span class="answer">' + solved.answer +
      '</span></summary><div class="work">' + solved.work + "</div></details>";
  };
  if (signs[0] === "/") {
    const divisor = parts[2];
    if (scale(divisor)) return {error: "Le diviseur doit être un nombre entier."};
    if (integer(divisor) === 0n) return {error: "On ne peut pas diviser par 0."};
    return {html: '<p class="calc-tag">Calculatrice · touche une ligne pour les étapes</p>' +
      [[0, "À l’unité"], [1, "Au dixième"], [2, "Au centième"]].map(([rank, tag]) => line({expression: query, rank}, tag)).join("")};
  }
  return {html: '<p class="calc-tag">Calculatrice</p>' + line({expression: query, rank: 0})};
}
/* Derniers calculs de la calculatrice (5 au plus, sur cet appareil, jamais de prénom).
   Un calcul est gardé quand on le quitte : Nouveau calcul, Échap, Entrée, champ vidé ou appli mise de côté. */
const RECENT_KEY = "correcteur-derniers-calculs";
let recent = [], pending = null;
try { recent = JSON.parse(localStorage.getItem(RECENT_KEY)) || []; } catch {}
function saveRecent() { try { localStorage.setItem(RECENT_KEY, JSON.stringify(recent)); } catch {} }
function keepPending() {
  if (!pending) return;
  recent = [pending, ...recent.filter(e => e !== pending)].slice(0, 5);
  pending = null; saveRecent();
}
function shortAnswer(expression) {
  try { return solve({expression, rank: 0}).answer.replace(/<small>Reste /, " r ").replace(/<[^>]+>/g, ""); } catch { return ""; }
}
function renderHistory(query) {
  const box = get("history");
  box.replaceChildren();
  if (query || !recent.length) return;
  box.innerHTML = '<p class="calc-tag">Derniers calculs · touche pour le reprendre</p>';
  for (const expression of recent) {
    const b = document.createElement("button");
    b.type = "button";
    b.innerHTML = pretty(expression) + " = <b>" + shortAnswer(expression) + "</b>";
    b.onclick = () => { first.value = pretty(expression).trim(); update(); };
    box.append(b);
  }
  const clear = document.createElement("button");
  clear.type = "button"; clear.className = "vider"; clear.textContent = "✕ Effacer la liste";
  /* Confirmation en deux touchers : confirm() est ignoré dans la fenêtre de Claude (page de Classe). */
  clear.onclick = () => {
    if (!clear.dataset.armed) {
      clear.dataset.armed = "1"; clear.textContent = "Touche encore pour effacer les " + recent.length;
      setTimeout(() => { if (clear.isConnected) { delete clear.dataset.armed; clear.textContent = "✕ Effacer la liste"; } }, 3000);
      return;
    }
    recent = []; saveRecent(); renderHistory("");
  };
  box.append(clear);
}
function update() {
  const query = normalize(first.value), choices = get("choices"), calcBox = get("calc-result");
  if (!query) keepPending();
  renderHistory(query);
  choices.replaceChildren();
  const candidates = query ? sheets.filter(s => s.operations[0].expression.startsWith(query)) : [];
  const matches = candidates.filter(s => exact(s.operations[0].expression, query));
  /* Deux fiches peuvent commencer par le même calcul : on propose les deux, avec leur 2e calcul pour les départager. */
  const ambiguous = matches.length > 1;
  const list = ambiguous ? matches : matches.length ? [] : candidates;
  const found = matches.length === 1 ? matches[0] : null;
  const calc = !matches.length ? calculator(query) : null;
  show(found);
  calcBox.innerHTML = calc?.html ?? "";
  if (calc?.html) pending = query;
  get("status").textContent = !query ? "" : found ? title(found) : ambiguous ? "Ce calcul commence " + matches.length + " fiches : choisis la bonne." :
    calc?.error ? calc.error : calc ? (list.length ? "" : "Ce calcul n’est le premier d’aucune fiche.") :
    !candidates.length ? "Aucune fiche ne commence par ce calcul." : candidates.length > 1 ? candidates.length + " fiches correspondent." : "Continue la saisie ou ouvre la fiche proposée.";
  get("dock").hidden = !found && !calc?.html;
  get("reset").textContent = "↺  " + (found || !calc?.html ? "Nouvelle fiche" : "Nouveau calcul");
  if (found) {
    const jump = document.createElement("button");
    jump.className = "choice go"; jump.textContent = "Voir le corrigé ↓";
    jump.onclick = () => show(found, true);
    choices.append(jump);
  } else if (list.length <= 8) {
    for (const sheet of list) {
      const b = document.createElement("button");
      b.className = "choice";
      b.innerHTML = (calc?.html ? "Fiche " : "") + title(sheet) + "<small>" + pretty(sheet.operations[0].expression) + (ambiguous ? " · puis " + pretty(sheet.operations[1].expression) : "") + "</small>";
      b.onclick = () => show(sheet, true);
      choices.append(b);
    }
  }
}
function markCatalog() {
  for (const b of document.querySelectorAll("#catalog button")) b.setAttribute("aria-current", String(!!shown && b.dataset.k === sheetKey(shown)));
}
function init() {
  first.addEventListener("input", update);
  first.addEventListener("keydown", e => { if (e.key === "Enter") { keepPending(); if (shown) show(shown, true); } });
  document.addEventListener("visibilitychange", () => { if (document.hidden) keepPending(); });
  for (const key of ["7","8","9","÷","4","5","6","×","1","2","3","−",",","0","⌫","+"]) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = key;
    if (key === "⌫") b.setAttribute("aria-label", "Effacer un caractère");
    if ("÷×−+".includes(key)) b.className = "op";
    b.addEventListener("pointerdown", e => e.preventDefault());
    b.onclick = () => {
      const f = first, start = f.selectionStart, end = f.selectionEnd;
      const from = key === "⌫" && start === end ? Math.max(0, start - 1) : start;
      f.setRangeText(key === "⌫" ? "" : key, from, end, "end");
      f.focus({preventScroll: true});
      f.dispatchEvent(new Event("input"));
    };
    get("keypad").append(b);
  }
  for (const belt of belts) {
    const row = document.createElement("div");
    row.className = "belt"; row.style.setProperty("--belt", belt.color);
    const dot = document.createElement("i"); dot.className = "dot";
    const name = document.createElement("span"); name.textContent = belt.name;
    row.append(dot, name);
    for (const sheet of belt.sheets) {
      const b = document.createElement("button");
      b.textContent = sheet.label; b.dataset.k = sheetKey(sheet);
      b.setAttribute("aria-label", title(sheet));
      b.onclick = () => { get("browse").open = false; show(sheet, true); };
      row.append(b);
    }
    get("catalog").append(row);
  }
  get("reset").onclick = () => { if (history.state?.fiche) history.back(); else newSheet(); };
  addEventListener("popstate", () => newSheet());
  document.addEventListener("keydown", e => { if (e.key === "Escape") get("reset").click(); });
  get("version").textContent = "version " + VERSION;
  renderHistory("");
}
function newSheet() {
  first.value = "";
  get("browse").open = false;
  update();
  first.focus({preventScroll: true});
  window.scrollTo({top: 0, behavior: "smooth"});
}

/* Évaluations (seulement dans Classe) */
const beltOf = {};
belts.forEach((b, i) => b.sheets.forEach(s => beltOf[sheetKey(s)] = i));
/* Une ceinture est validée si une de ses fiches a « A », ou si elle a été validée automatiquement (clé = nom de la ceinture seul). */
const validated = (b, name) => store.get(b.name, name) === "A" || b.sheets.some(s => store.get(sheetKey(s), name) === "A");
function acquired(name) { /* plus haute ceinture validée */
  for (let i = belts.length - 1; i >= 0; i--) if (validated(belts[i], name)) return i;
  return -1;
}
let autoPrev = true;
try { autoPrev = localStorage.getItem("calcul-auto-precedentes") !== "0"; } catch {}
let toPass = false;
try { toPass = localStorage.getItem("calcul-a-passer") === "1"; } catch {}
/* Cases à écrire pour un élève : la fiche, et (si A) les ceintures d'avant pas encore validées. */
function changes(key, name, m) {
  const list = [{key, name, m}];
  if (m === "A" && autoPrev) for (let i = 0; i < beltOf[key]; i++)
    if (!validated(belts[i], name)) list.push({key: belts[i].name, name, m: "A"});
  return list;
}
function onMarked(names, m, extra) {
  if (names.length > 1) Evals.toast(names.length + " élèves : " + (m || "effacé") + (extra ? " · " + extra + " ceinture" + (extra > 1 ? "s" : "") + " d’avant aussi" : ""));
  else if (extra) Evals.toast(names[0] + " : " + extra + " ceinture" + (extra > 1 ? "s" : "") + " d’avant validée" + (extra > 1 ? "s" : "") + " aussi");
}
/* Pour chaque élève : ses ceintures obtenues (pastilles pleines), et si la ceinture ouverte est déjà obtenue ailleurs (autre fiche ou validation auto). */
function pupils() {
  const here = shown ? beltOf[sheetKey(shown)] : -1, b = belts[here], current = shown && sheetKey(shown);
  /* « À passer » : seulement ceux dont la ceinture ouverte est la prochaine, et ceux déjà évalués sur cette fiche (pour ne pas les perdre de vue). */
  const roster = toPass && b ? store.roster.filter(p => acquired(p.name) + 1 === here || store.get(current, p.name)) : store.roster;
  return roster.map(p => {
    const i = acquired(p.name);
    const dots = '<span class="mini-belts" aria-hidden="true">' + belts.map((x, k) =>
      '<i style="--belt:' + x.color + '" title="' + x.name + '" class="' + (validated(x, p.name) ? "on" : "") + (k === here ? " ici" : "") + '"></i>').join("") + "</span>";
    let deja = "";
    if (b && store.get(current, p.name) !== "A" && validated(b, p.name)) {
      const keys = [b.name].concat(b.sheets.map(sheetKey)).filter(k => store.get(k, p.name) === "A");
      const l = store.last(keys, p.name);
      deja = '<span class="deja">✓ ' + b.name + " déjà obtenue" + (l ? " (" + (l.key === b.name ? "auto" : "fiche " + l.key.split("-").pop()) + ")" : "") + "</span>";
    }
    return {...p, info: p.group + " · " + (i >= 0 ? "ceinture " + belts[i].name.toLowerCase() : "aucune ceinture") + dots + deja};
  });
}
async function startEvals() {
  if (MODE_APP) {
    get("evals-app").innerHTML = '<div class="vers-classe"><span>👥 Les évaluations des élèves se font dans <b>Classe</b> › Outils et réglages › Maths.</span><a class="btn petit" href="' + CLASSE_URL + '" target="_blank" rel="noopener">Ouvrir Classe ↗</a></div>';
    return;
  }
  get("back").hidden = false;
  try {
    store = await Evals.start("calcul", VERSION);
    panel = new Evals.Panel(evalHost, {store, key: () => shown && sheetKey(shown), pupils, filters: true, pdf: exportPdf, changes, onMarked, onFilter: renderGrid,
      extra: () => '<button type="button" class="btn petit" data-ev="x" data-x="passer" aria-pressed="' + toPass + '" title="Seulement les élèves dont c’est la prochaine ceinture">' + (toPass ? "✓ À passer" : "À passer") + "</button>" +
        '<button type="button" class="btn petit" data-ev="x" data-x="auto" aria-pressed="' + autoPrev + '" title="Un A valide aussi les ceintures d’avant pas encore validées">' + (autoPrev ? "✓" : "✗") + " Ceintures d’avant : " + (autoPrev ? "auto" : "non") + "</button>",
      onExtra: b => {
        if (b.dataset.x === "passer") { toPass = !toPass; try { localStorage.setItem("calcul-a-passer", toPass ? "1" : "0"); } catch {} }
        else { autoPrev = !autoPrev; try { localStorage.setItem("calcul-auto-precedentes", autoPrev ? "1" : "0"); } catch {} }
      }});
    store.on(renderGrid);
    get("grille-box").hidden = false;
    renderGrid();
    if (shown) { const s = shown; shown = null; show(s); }
  } catch (e) {
    evalHost.innerHTML = '<div class="vers-classe"><span>⚠ Les évaluations n’ont pas pu se charger (base de Classe injoignable).</span><button class="btn petit" type="button" id="retry">↻ Réessayer</button></div>';
    evalHost.querySelector("#retry").onclick = startEvals;
  }
}
/* Grille de la classe : dernière évaluation de chaque ceinture, même filtre de groupe que le panneau. */
function renderGrid() {
  const box = get("grille");
  if (!store || !panel || !box) return;
  const L = panel.byGroup(store.roster);
  const esc = t => String(t).replace(/[&<>"']/g, c => "&#" + c.charCodeAt(0) + ";");
  box.innerHTML = L.length ? "<table><thead><tr><th></th>" + belts.map(b => '<th title="' + b.name + '"><i style="--belt:' + b.color + '"></i></th>').join("") + "</tr></thead><tbody>" +
    L.map(p => "<tr><th>" + esc(p.name) + "</th>" + belts.map((b, i) => {
      const keys = [b.name].concat(b.sheets.map(sheetKey)), l = store.last(keys, p.name);
      const ok = validated(b, p.name), m = ok ? "A" : l ? l.m : "";
      return '<td><button type="button" data-b="' + i + '" data-n="' + esc(p.name) + '"' + (m ? ' data-m="' + m + '"' : "") + ' title="' + esc(p.name) + " · " + b.name + (m ? " · " + m : "") + '" aria-label="' + esc(p.name) + " · " + b.name + " · " + (m || "non évalué") + '">' + (m && m !== "A" ? m : "") + "</button></td>";
    }).join("") + "</tr>").join("") + "</tbody></table>" : '<p class="calc-tag">Aucun élève dans ce groupe.</p>';
}
get("grille").addEventListener("click", e => {
  const c = e.target.closest("button[data-b]");
  if (!c) return;
  const b = belts[+c.dataset.b], name = c.dataset.n;
  const l = store.last(b.sheets.map(sheetKey), name);
  const sheet = (l && b.sheets.find(s => sheetKey(s) === l.key)) || b.sheets[0];
  show(sheet, true);
  const panelBox = evalHost.querySelector("details.evals");
  if (panelBox) panelBox.open = true;
  setTimeout(() => {
    const row = [...evalHost.querySelectorAll(".evlist li")].find(li => li.querySelector('[data-n="' + CSS.escape(name) + '"]'));
    if (!row) { Evals.toast(name + " n’est pas dans la liste (filtre « À passer » ou groupe)"); return; }
    row.scrollIntoView({block: "center", behavior: "smooth"});
    row.classList.remove("flash"); void row.offsetWidth; row.classList.add("flash");
  }, 450);
});
function exportPdf() {
  const rows = store.roster.map(p => ({name: p.name, cells: belts.map(b => {
    const l = store.last([b.name].concat(b.sheets.map(sheetKey)), p.name);
    return l ? {m: l.m, t: l.m + " · " + (l.key === b.name ? "auto" : l.key.split("-").pop())} : null;
  })}));
  return Evals.pdf({sections: [{title: "Ceintures de calcul posé", sub: "Dernière évaluation de chaque ceinture (code · fiche, « auto » = validée par une ceinture suivante)", cols: belts.map(b => b.name), rows}],
    filename: "evaluations-ceintures-calcul.pdf", color: "#23914A", colsPerPage: 11});
}

init();
startEvals();
if (MODE_APP && "serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("./sw.js").catch(() => {});
</script>
<script>if (!MODE_APP) document.write('<script src="side-nav.js" defer><\/script>');</script>
</body>
