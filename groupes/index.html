<!doctype html>
<!-- TECHNIQUE
Fiche d'identité
- Rôle : créer des groupes de travail équilibrés selon des critères choisis, puis les projeter.
- Quand : la veille pour préparer, ou en classe juste avant l'activité.
- Où : ordi de classe / TBI (projection), téléphone (retouches).
- Écran n° 1 : taille des groupes + bouton « Créer les groupes », puis les cartes des groupes.
- Ce qu'il ne fait pas : les scores de fluence se saisissent dans l'onglet Lecture (lecture.html).
Version : 1.10.0 (21/11/2026) : un seul fichier pour Classe (groupes.html) et le kit « Outils de classe partagés » (dépôt outils-classe, groupes/index.html) ;
  dans le kit : élèves de « Ma classe », données sur l'appareil (commun/kit-db.js imite la base), barre Outils / Ma classe / Groupes / Plan de classe, sans mention de la fluence.
Version : 1.9.1 (15/11/2026) : colonne commune de Classe (side-nav.js) à gauche sur ordinateur, liens de la barre du haut masqués.
Version : 1.9.0 (14/11/2026)
- 1.9 : charte « Repères » : couleurs et police de la charte (Atkinson Hyperlegible seule), en-tête bleu pâle, barre des pages de Classe (← Classe, Maths, Photocopies, Groupes, Plan de classe, Fluence).
- 1.8 : exceptions « peut être la seule fille » (eleves[sid].fs = 1), réglables sous le critère et dans la fiche de l'élève.
- 1.7 (09/11)
- 1.7 : deux réglages séparés : p.sexe (ign|mix) et p.fseule (ok|non) ; ancien "f2" → mix + non. Les volets Critères / Compétences restent ouverts ou fermés comme Xavier les a laissés (S.ouvert, événement toggle).
- 1.6 (09/11)
- 1.6 : Filles et garçons : choix « Jamais une fille seule » (p.sexe = "f2" : pénalité 60 si un groupe a exactement 1 fille, mixité légère ensuite ; groupes sans garçon acceptés).
- 1.5 (09/11)
- 1.5 : critère Filles et garçons (p.sexe = ign|mix) ; eleves[sid].s = "f"|"g", saisi dans Élèves › Profils (bouton ? → 👧 → 👦).
- 1.4 (09/11)
- 1.4 : élèves toujours par ordre alphabétique (liste lue dans Lecture triée ; membres des groupes triés à l'affichage par alpha()).
- 1.3 (08/11)
- 1.3 : minuteur du plein écran (durée par menu, pause, sonnerie réglable avant la fin + message, son de fin, volume ; p.tm), rôles en pastilles de couleur (r.c réglable).
- 1.2 (06/11)
- 1.2 : Lecture = compétence (préremplie avec les groupes 1-4 de Lecture), onglets « Préparer les groupes » / « Créer avec les élèves » (sans infos perso),
  critères et rôles avec le bouton Créer, effacer les rôles, glisser-déposer (poignée ⠿), légende des rôles en plein écran, bouton Valider supprimé.
- 1.1 : profils de fluence 1-4, groupes d'amis, saisie des compétences par compétence, vue élèves.
Choix techniques :
- Page de l'artéfact « Classe ». Lit les élèves dans lecture/main (prénom, niveau, scores, profil) sans les recopier.
- Ses propres données dans lecture/groupes (règle « lecture » : lecture et écriture réservées à admin, donc privées).
- Copie locale « classe-groupes-v1 » affichée d'abord, puis la base fait foi. Le plus récent (ts) gagne ;
  si les deux ont changé, une fenêtre demande laquelle garder. Jamais d'envoi de l'état par défaut si la base n'a pas répondu.
- Répartition : coût pondéré par critère + recherche locale (échanges) avec plusieurs départs aléatoires.
  Ignorer = 0 ; Si possible = 6 par écart ; Obligatoire = 1000 par écart.
- Projection : prénoms et rôles seulement (ni score, ni comportement).
Décisions de structure :
- eleves[sid] = {o:"g"|"n"|"p" (oral), c:1 (étiquette comportement), k:{compId:1..3}}
- amis = [[sidA,sidB]] (symétrique) ; amisG = [{id, m}] (groupes d'amis) ; sep = [{id, m:[sid…]}] (paires ou groupes à séparer)
- comps[{src:"fluence",max:4}] : Lecture, préremplie par le groupe 1-4 de l'onglet Lecture ; une valeur saisie à la main dans eleves[sid].k la remplace
- cur = {d, g:[{m:[sid], r:{sid:roleId}}], cons} ; saved = [{id, nom, d, g}] ; hist = [{d, g}] (30 max)
-->
