<!DOCTYPE html>
<!-- TECHNIQUE
Page « Dictées adaptées » de Classe (dictees-adaptees.html + dictees-adaptees.json).
Fiche d'identité
- Rôle : préparer les dictées adaptées (bandes jaune + verte, Retz « Dictées et histoire des arts ») : mots à apprendre par élève,
  mots à écrire, mots à choisir, fiches, bandeaux, étiquettes, corrigé, dictée en ligne.
- Quand : le soir pour préparer et imprimer ; en classe pour la dictée en ligne. Où : ordi maison, ordi de classe, téléphone.
- Écran n° 1 : la prochaine dictée de l'année (d'après les cycles de Classe), telle que l'élève la verra.
- Ce qu'il ne fait pas : les dates des cycles (journal de Classe, vue Dictées), les dictées originales (page « Dictées et dictées adaptées »).
Version : voir VERSION
- 2.5.0 (21/11/2026) : un seul fichier pour Classe (dictees-adaptees.html) et le kit « Outils de classe partagés » (dépôt outils-classe, dictees/index.html).
  Dans le kit (MODE_APP) : onglet « Mes dictées » (texte, mots, règle, mots à trous, date : tout facultatif sauf le texte ; S.data.textes),
  cycle réglable (S.data.cycle : étapes, semaine, jour, devoirs avec {n} {mots} {regle} {titre}), « Aujourd’hui » (copier, projeter, étiquettes à imprimer),
  partage de dictées par fichier ; pas de fichier Retz, pas de « dictées faites » ni de notions liées aux leçons de Xavier ; réglages localStorage « kit-dictees ».
- 2.4.0 (16/11/2026) : mots à apprendre au-delà du nombre de mots de la fiche : grisés dans Préparer (aussi pour la fiche sans prénom), trait ✂ de la fiche sans prénom dans la liste,
  réglage « − N + mots » de la personne choisie juste au-dessus de la liste, message quand un mot ajouté tombe au-delà (il n'était ni dans le bandeau ni effacé sur la fiche).
  Fiche sans prénom masquée par défaut (data.ficheBase, réglable dans Réglages › Élèves ; toujours là s'il n'y a aucun élève) : pourOk() ramène « pour » sur le 1er élève et « qui » sur Tous.
  Adresse #i<n° de la dictée>-ban ou -fiche : ouvre Imprimer pour tous les élèves, avec les bandeaux, ou les fiches + le corrigé (boutons « Imprimer » de la page Photocopies, Classe v167).
- 2.3.2 (15/11/2026) : onglets Dictée / Préparer / Imprimer / Réglages plus visibles : sur ordinateur en tête de la colonne commune (tuiles, data-cnav-page) ; sur téléphone, barre du bas en noir, onglet en cours sur fond rose.
- 2.3.1 (15/11/2026) : colonne commune de Classe (side-nav.js) à gauche sur ordinateur ≥ 1180 px ; « ← Classe » masqué (data-cnav-hide), barre d'onglets du bas décalée à droite de la colonne.
- 2.3.0 (14/11/2026) : charte « Repères » : interface en Atkinson Hyperlegible et couleurs de la charte, en-tête rose pâle (couleur de l'outil) ;
  Lexend gardée pour ce que voit l'élève (dictée en ligne, fiches A4, mots à choisir).
Choix techniques :
- dictees-adaptees.json : textes balisés, {faux|*juste}#cat = choix d'origine. Mots repérés par une clé stable : c<i> (i-ème choix du texte) ou w<p>.<j> (j-ème mot du paragraphe p).
- Réglages : localStorage + base de Classe, document dictees/reglages {maj, data}. La version la plus récente gagne ; si les deux ont changé, une fenêtre demande.
- État d'un mot (data.ov[n][clé]) : 'g' donné, 'e' à écrire sans l'apprendre, {o:[propositions], k:juste} à choisir. Liste des mots à apprendre : data.mots[n] (ordre = priorité, au-delà de 8 : ⚠).
- Dictées faites : data.faites (prérempli d'après le livret « Leçons d'orthographe » H1-H17). Numéro dans l'année = rang parmi les dictées faites.
- Notions : une notion n'est proposée en choix qu'à partir de la dictée où sa leçon a été vue (auto), ou selon le réglage.
- Lecture seule de journal/main (cycles : numéro, date de la dictée bilan).
-->

:root[data-theme=dark]{--bg:#0F1522;--paper:#172033;--ink:#E9EEF7;--muted:#A3AEC2;--line:#2C3852;--blue:#1F2D52;--blue-b:#7EA2FF;--on:#0F1522;--entete:#3A1A2A;--entete-ink:#F8E8EF;--entete-doux:#D9AFC2;--entete-ctl:#46202F;--entete-bd:#6A3550;--entete-on:#E886B0;--entete-on-ink:#1E0C15;--yel:#4A3F12;--yel-b:#E0C040;--or:#4A2E12;--or-b:#F0A060;--ok:#5CC883;--ok-bg:#1C3A27;--ko:#F2915E;--ko-bg:#40261A}

<body>
<main id="app"><p class="muted">Chargement des dictées…</p></main>
<nav id="tabs" aria-label="Onglets" data-cnav-page="Dictées adaptées"></nav>
<div id="eleve" aria-live="polite"></div>
<div class="ov" id="ov"><div class="dlg" id="dlg" role="dialog" aria-modal="true"></div></div>
<div id="printzone" aria-hidden="true"></div>
<div id="msg" role="status"></div>
<script>
var VERSION="2.5.0", KEY="classe-dictees-adaptees", DBPATH="dictees/reglages";
/* Programme de l'année (livret « Leçons d'orthographe », règles H1 à H17) : dictées Retz faites, dans l'ordre */
var PROGRAMME=[1,2,3,4,7,8,10,11,12,13,14,18,19,20,23,24,26];
/* Notions proposées en choix : t = dictée Retz où la leçon est vue (auto) ; def = réglage par défaut */
var NOTIONS=[
 ["gn","Accord dans le groupe nominal (pluriel, féminin)",[1],"auto"],
 ["verbe","Accord du verbe avec son sujet",[26],1],
 ["a/à","a / à",[2],"auto"],
 ["et/est","et / est",[3],"auto"],
 ["ou/où","ou / où",[7],"auto"],
 ["son/sont","son / sont",[10],"auto"],
 ["on/ont","on / ont",[11],"auto"],
 ["ce/se","ce / se",[20],"auto"],
 ["ces/ses","ces / ses (leçon pas au programme cette année)",[],0],
 ["c’est/s’est","c’est / s’est (leçon pas au programme cette année)",[],0],
 ["é/er","-é / -er à la fin d'un verbe",[23],"auto"],
 ["ppa","Accord du participe passé",[24],"auto"],
 ["fem","Féminin des noms",[15],"auto"]
];
var CATS={gn:"accord GN",verbe:"accord sujet-verbe",ppa:"participe passé",pp:"-é / -er",fem:"féminin",perso:"choix ajouté"};
var WL=new Set(["jusqu’à","aujourd’hui","d’abord","c’est-à-dire","quelqu’un","presqu’île"]);
var D=[], CYC={}, ELEVES_CLASSE=null;
/* Kit : pas de programme ni de notions liés aux leçons de Xavier ; réglages rangés à part sur l'appareil */
if(MODE_APP){ KEY="kit-dictees"; PROGRAMME=[]; NOTIONS.forEach(function(x){x[2]=[];x[3]=0}); }
function $(s){return document.querySelector(s)}
function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function txt(t){return esc(t).replace(/\^(\w+)/g,"<sup>$1</sup>")}
function toast(t){var m=$("#msg");m.textContent=t;m.style.opacity=1;clearTimeout(m._t);m._t=setTimeout(function(){m.style.opacity=0},3200)}

/* ---------- données et migration ---------- */
function defaut(){var f={};PROGRAMME.forEach(function(n){f[n]=true});var no={};NOTIONS.forEach(function(x){no[x[0]]=x[3]});
  return {v:2,maj:"",detBase:true,proBase:true,faites:f,notions:no,eleves:[],ficheBase:false,nbDefaut:8,mots:{},ov:{},periodes:[1,4,8,11,15],copies:4,theme:"auto",tout:false}}
function borne(n,mx){return Math.max(1,Math.min(mx||12,Math.round(n)))}
function migrer(d){
  var b=defaut(); d=(d&&typeof d==="object")?d:{};
  var r=Object.assign(b,d);
  r.faites=(d.faites&&typeof d.faites==="object")?d.faites:b.faites;
  r.notions=Object.assign(defaut().notions,(d.notions&&typeof d.notions==="object")?d.notions:{});
  r.eleves=Array.isArray(d.eleves)?d.eleves.filter(function(e){return e&&e.id}).map(function(e){return {id:String(e.id),prenom:String(e.prenom||""),nb:borne(+e.nb||8),det:e.det!==false,pro:e.pro!==false}}):[];
  r.mots=(d.mots&&typeof d.mots==="object")?d.mots:{};
  r.ov=(d.ov&&typeof d.ov==="object")?d.ov:{};
  r.periodes=Array.isArray(d.periodes)&&d.periodes.length===5?d.periodes.map(function(x){return +x||1}):b.periodes;
  r.ficheBase=d.ficheBase===true; /* 2.4.0 : fiche sans prénom masquée par défaut (réglable) */
  r.nbDefaut=borne(+r.nbDefaut||8); r.copies=Math.max(1,Math.min(8,+r.copies||4)); r.v=2; delete r.homos;
  return r;
}
function lireLocal(){
  try{var raw=localStorage.getItem(KEY); if(!raw) return {data:migrer(defaut()),dirty:false,base:"",ui:{}};
    var o=JSON.parse(raw); return {data:migrer(o.data),dirty:!!o.dirty,base:o.base||"",ui:o.ui||{}};}
  catch(e){ try{localStorage.setItem(KEY+"-secours",localStorage.getItem(KEY))}catch(x){} return {data:migrer(defaut()),dirty:false,base:"",ui:{},abime:true}; }
}
var L=lireLocal(); var S={data:L.data,ui:Object.assign({cur:0,tab:"dictee",pour:"base",rep:{},brush:"L"},L.ui)};
function sauverLocal(){try{localStorage.setItem(KEY,JSON.stringify({data:S.data,dirty:L.dirty,base:L.base,ui:S.ui}))}catch(e){}}
/* annuler / rétablir : HIST.last = état avant la prochaine modification */
var HIST={u:[],r:[],last:null};
function histReset(){HIST.u=[];HIST.r=[];HIST.last=JSON.stringify(S.data);majBoutonsHist();}
function modifier(){
  var avant=HIST.last; if(avant&&avant!==JSON.stringify(S.data)){HIST.u.push(avant); if(HIST.u.length>60)HIST.u.shift(); HIST.r=[];}
  S.data.maj=new Date().toISOString(); L.dirty=true; HIST.last=JSON.stringify(S.data); sauverLocal(); planifierEnvoi(); afficherSync(); majBoutonsHist();}
function appliquerHist(de,vers,msg){ if(!de.length){toast(msg[1]);return}
  vers.push(JSON.stringify(S.data)); S.data=migrer(JSON.parse(de.pop())); S.data.maj=new Date().toISOString(); L.dirty=true; HIST.last=JSON.stringify(S.data);
  sauverLocal(); planifierEnvoi(); appliquerTheme(); rendre.garder=true; rendre(); toast(msg[0]); }
function annuler(){appliquerHist(HIST.u,HIST.r,["↶ Modification annulée","Rien à annuler"])}
function refaire(){appliquerHist(HIST.r,HIST.u,["↷ Modification rétablie","Rien à rétablir"])}
function majBoutonsHist(){var a=$("#bU"),b=$("#bR"); if(a)a.disabled=!HIST.u.length; if(b)b.disabled=!HIST.r.length;}

/* ---------- synchronisation par la base de Classe ---------- */
var db=null, syncEtat="attente", envoiT=null, envoiEnCours=false, conflitOuvert=false;
function fdate(iso){if(!iso)return "jamais";var d=new Date(iso);return d.toLocaleDateString("fr-FR")+" à "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}
function afficherSync(){var el=$("#sync"); if(!el)return;
  el.textContent= syncEtat==="ok"?(L.dirty?"⟳ Enregistrement…":(MODE_APP?"✓ Sur cet appareil · ":"✓ Synchronisé · ")+fdate(S.data.maj)) : syncEtat==="lent"?"⏳ Base lente : tes changements restent sur cet appareil" : syncEtat==="hors"?"Enregistré sur cet appareil seulement" : syncEtat==="conflit"?"⚠ Deux versions à départager" : "⟳ Connexion à la base…";}
async function initSync(){
  try{ db=window.claude&&window.claude.use?await window.claude.use("db"):null; }catch(e){db=null}
  if(!db){syncEtat="hors";afficherSync();return}
  lireClasse();
  var t=setTimeout(function(){syncEtat="lent";afficherSync()},10000);
  try{
    var snap=await db.doc(DBPATH).get(); clearTimeout(t);
    var remote=snap.exists?snap.data():null;
    if(!remote||!remote.data){ syncEtat="ok"; if(!L.abime) await pousser(); else afficherSync(); return; }
    var r=migrer(JSON.parse(JSON.stringify(remote.data))); r.maj=remote.maj||r.maj||"";
    syncEtat="ok";
    if(!L.dirty){ if(r.maj!==S.data.maj){S.data=r;L.base=r.maj;sauverLocal();histReset();appliquerTheme();rendre();} else {L.base=r.maj;sauverLocal()} afficherSync(); }
    else if(L.base===r.maj||!r.maj){ await pousser(); }
    else conflit(r);
  }catch(e){clearTimeout(t);syncEtat="hors";afficherSync();}
}
function planifierEnvoi(){ if(!db||syncEtat!=="ok"||conflitOuvert)return; clearTimeout(envoiT); envoiT=setTimeout(pousser,1200); }
async function pousser(){
  if(!db||conflitOuvert)return; if(envoiEnCours){planifierEnvoi();return}
  envoiEnCours=true; var maj=S.data.maj||new Date().toISOString(); if(!S.data.maj)S.data.maj=maj;
  try{ await db.doc(DBPATH).set({maj:maj,data:JSON.parse(JSON.stringify(S.data))});
    if(S.data.maj===maj){L.dirty=false;L.base=maj;} sauverLocal(); syncEtat="ok";
  }catch(e){ syncEtat=(e&&e.code==="unavailable")?"lent":"hors"; if(e&&e.code==="unavailable")setTimeout(planifierEnvoi,4000); }
  envoiEnCours=false; afficherSync();
}
function conflit(r){
  conflitOuvert=true; syncEtat="conflit"; afficherSync();
  ouvrir('<h2 style="margin-top:0">Deux versions différentes</h2><p>Tes réglages de dictées ont changé sur cet appareil <b>et</b> dans la base (sur un autre appareil).</p>'
   +'<p>Sur cet appareil : <b>'+fdate(S.data.maj)+'</b><br>Dans la base : <b>'+fdate(r.maj)+'</b></p><p class="muted small">La version non choisie est gardée en copie de secours sur cet appareil.</p>'
   +'<div class="row end"><button class="btn" id="cfB">Garder la base</button><button class="btn p" id="cfL">Garder cet appareil</button></div>',true);
  $("#cfB").onclick=function(){try{localStorage.setItem(KEY+"-secours",JSON.stringify(S.data))}catch(e){} S.data=r;L.dirty=false;L.base=r.maj;conflitOuvert=false;syncEtat="ok";sauverLocal();histReset();fermer();appliquerTheme();rendre();afficherSync();toast("Version de la base gardée")};
  $("#cfL").onclick=async function(){try{localStorage.setItem(KEY+"-secours",JSON.stringify(r))}catch(e){} conflitOuvert=false;syncEtat="ok";S.data.maj=new Date().toISOString();fermer();await pousser();toast("Version de cet appareil gardée")};
}
document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="visible"&&db&&!L.dirty&&!conflitOuvert&&syncEtat==="ok") recharger(); });
async function recharger(){ try{var snap=await db.doc(DBPATH).get(); var remote=snap.exists?snap.data():null;
  if(remote&&remote.data&&remote.maj&&remote.maj!==S.data.maj&&!L.dirty){S.data=migrer(JSON.parse(JSON.stringify(remote.data)));S.data.maj=remote.maj;L.base=remote.maj;sauverLocal();histReset();appliquerTheme();rendre();toast("Réglages mis à jour depuis un autre appareil")}}catch(e){} }
/* lecture seule : dates des cycles du journal et prénoms de la classe */
async function lireClasse(){
  if(!MODE_APP) try{ var s=await db.doc("journal/main").get(); if(s.exists){ var d=s.data()||{}; var st=d.cycles?d:(d.state&&d.state.cycles?d.state:(d.main&&d.main.cycles?d.main:null));
      if(st){ CYC={}; st.cycles.forEach(function(c){var n=parseInt(c.num,10); if(n>0&&(c.dictee||c.mots))CYC[n]={dictee:c.dictee||"",mots:c.mots||"",regle:c.regle||""}});
        if(!S.ui.choisi){var k=prochaine(); if(k){S.ui.cur=k-1;}} rendre(); } } }catch(e){}
  try{ var m=await db.doc("maths/core").get(); if(m.exists){ var st2=(m.data()||{}).students; if(st2&&typeof st2==="object"){ ELEVES_CLASSE=[]; Object.keys(st2).forEach(function(g){(st2[g]||[]).forEach(function(p){ELEVES_CLASSE.push({p:p,g:g})})}); if(S.ui.tab==="reglages")rendre(); } } }catch(e){}
}
function aujourdhui(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function prochaine(){ /* numéro Retz de la prochaine dictée bilan d'après les cycles de Classe */
  var t=aujourdhui(), best=null; Object.keys(CYC).forEach(function(k){var c=CYC[k]; if(c.dictee&&c.dictee>=t&&(!best||c.dictee<CYC[best].dictee))best=k});
  if(!best)return null; var f=faites(); return f[best-1]||null; }
function fcourt(iso){if(!iso)return "";var p=iso.split("-");var d=new Date(+p[0],+p[1]-1,+p[2]);return d.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"})}

/* ---------- dictées faites, numéros de l'année, notions ---------- */
function faites(){if(MODE_APP)return D.map(function(d){return d.n});return D.filter(function(d){return !!S.data.faites[d.n]}).map(function(d){return d.n})}
function rang(n){ var f=faites(), i=f.indexOf(n); if(i>=0)return i+1; return f.filter(function(x){return x<n}).length+0.5; } /* dictée non faite : entre deux */
function etiquette(n){ var r=rang(n); if(MODE_APP)return "Dictée "+r; return r%1?"hors programme":"Dictée "+r+" · H"+r; }
function debutNotion(key){ var nt=NOTIONS.find(function(x){return x[0]===key}); if(!nt)return 1; var v=S.data.notions[key];
  if(v==="auto"){ var f=faites(), idx=nt[2].map(function(n){return f.indexOf(n)}).filter(function(i){return i>=0}); return idx.length?Math.min.apply(null,idx)+1:0; }
  return +v||0; }
function notionActive(key,n){ var s=debutNotion(key); return s>0&&rang(n)>=s; }
function notionDe(it){ if(it.cat==="homo")return homoKey(it.opts); if(it.cat==="pp")return "é/er"; if(it.cat==="perso")return null; return it.cat in {gn:1,verbe:1,ppa:1,fem:1}?it.cat:null; }
var HOMO_MOTS={"ces":["ces/ses",["ces","ses"]],"ses":["ces/ses",["ces","ses"]],"c’est":["c’est/s’est",["c’est","s’est"]],"s’est":["c’est/s’est",["c’est","s’est"]]};
function homoAuto(n,p){ if(p.t!=='w')return null; var full=(p.pre||"")+p.w, h=HOMO_MOTS[cle(full)]; if(!h||!notionActive(h[0],n))return null;
  var maj=/^\p{Lu}/u.test(full), o=h[1].map(function(x){return maj?x.charAt(0).toUpperCase()+x.slice(1):x}); return {o:o,k:o.indexOf(maj?cle(full).charAt(0).toUpperCase()+cle(full).slice(1):cle(full)),notion:h[0],full:full}; }
function homoKey(opts){var o=opts.map(function(x){return x.toLowerCase().replace(/^(jusqu|qu)[’']/,"")});var ks=["a/à","et/est","on/ont","son/sont","ou/où","ce/se"];for(var i=0;i<ks.length;i++){var ab=ks[i].split("/");if(o.indexOf(ab[0])>=0&&o.indexOf(ab[1])>=0)return ks[i];}return null}

/* ---------- découpage du texte en morceaux repérés ---------- */
function motDe(tok){var t=tok;while(t.indexOf("’")>=0){if(WL.has(t.toLowerCase()))return t;var r=t.slice(t.indexOf("’")+1);if(!r)return null;t=r}return t}
var PCACHE={};
function parse(n){ /* [[{t:'x',v}|{t:'c',key,opts,ok,cat}|{t:'w',key,pre,w,raw}]] */
  if(PCACHE[n])return PCACHE[n]; var ci=0;
  var paras=D[n-1].src.split(" ¶ ").map(function(p,pi){var out=[],re=/\{([^}]*)\}#(\w+)/g,last=0,m,wi=0;
    function texte(s){ s.replace(/[\p{L}\p{M}’\-]+|[^\p{L}\p{M}’\-]+/gu,function(tok){
        if(!/\p{L}/u.test(tok)){out.push({t:'x',v:tok});return tok}
        var w=motDe(tok); if(!w){out.push({t:'x',v:tok});return tok}
        out.push({t:'w',key:"w"+pi+"."+(wi++),pre:tok.slice(0,tok.length-w.length),w:w,first:out.filter(function(o){return o.t!=='x'}).length===0}); return tok;}); }
    while((m=re.exec(p))){ if(m.index>last)texte(p.slice(last,m.index));
      var raw=m[1].split("|");
      if(raw.length<2){ var w1=raw[0].replace("*",""); out.push({t:'w',key:"c"+(ci++),pre:"",w:w1,first:out.filter(function(o){return o.t!=='x'}).length===0}); last=re.lastIndex; continue; }
      out.push({t:'c',key:"c"+(ci++),opts:raw.map(function(o){return o.replace("*","")}),ok:raw.findIndex(function(o){return o.charAt(0)==="*"}),cat:m[2]}); last=re.lastIndex;}
    if(last<p.length)texte(p.slice(last)); return out;});
  return PCACHE[n]=paras;
}
function motsDe(n){var m=S.data.mots[n]; return Array.isArray(m)?m:D[n-1].mots.slice()}
function ovDe(n){return S.data.ov[n]||{}}
var DET=new Set(["le","la","les","un","une","des","du","au","aux","ce","cet","cette","ces","mon","ton","son","ma","ta","sa","mes","tes","ses","notre","votre","nos","vos","leur","leurs"]);
var PRO=new Set(["je","tu","il","elle","on","nous","vous","ils","elles"]);
function profil(pour){ var e=pour&&pour!=="base"?S.data.eleves.find(function(x){return x.id===pour}):null;
  return e?{nb:e.nb,det:e.det!==false,pro:e.pro!==false}:{nb:S.data.nbDefaut,det:S.data.detBase!==false,pro:S.data.proBase!==false}; }
function nbPour(pour){ if(pour==="base")return S.data.nbDefaut; var e=S.data.eleves.find(function(x){return x.id===pour}); return e?e.nb:S.data.nbDefaut }
function nomPour(pour){ var e=S.data.eleves.find(function(x){return x.id===pour}); return e?e.prenom:"" }
function cle(w){return String(w).toLowerCase().replace(/'/g,"’")}
/* état final d'un mot : {etat:'g'|'L'|'E'|'C', ...} */
function construire(n,nb,opt){
  if(typeof nb==="object"){opt=nb;nb=opt.nb;} opt=opt||{det:S.data.detBase!==false,pro:S.data.proBase!==false};
  var mots=motsDe(n), app=mots.slice(0,nb).map(cle), ov=ovDe(n), items=[];
  var paras=parse(n).map(function(parts){var out=[];function X(v){var l=out[out.length-1]; if(l&&l.t==='x')l.v+=v; else out.push({t:'x',v:v})}
    parts.forEach(function(p){
      if(p.t==='x'){X(p.v);return}
      var o=ov[p.key], w=p.t==='w'?p.w:p.opts[p.ok], pre=p.t==='w'?p.pre:"";
      if(o&&typeof o==="object"&&Array.isArray(o.o)){ if(!(pre&&o.o.some(function(x){return cle(x).indexOf(cle(pre))===0})))X(pre); items.push({type:'c',opts:o.o,ok:o.k,cat:'perso',key:p.key}); out.push({t:'i',i:items.length-1}); return; }
      if(o==='e'){ X(pre); items.push({type:'b',ok:w,src:'e',key:p.key}); out.push({t:'i',i:items.length-1}); return; }
      if(p.t==='c'&&o!=='g'){ var nk=notionDe(p);
        if(!nk||notionActive(nk,n)){ items.push({type:'c',opts:p.opts,ok:p.ok,cat:p.cat,notion:nk,key:p.key}); out.push({t:'i',i:items.length-1}); return; } }
      if(o==='g'){ X(pre+w); return; }
      var r=app.indexOf(cle(w));
      if(r>=0){ X(pre); items.push({type:'b',ok:w,src:'L',rang:r+1,key:p.key}); out.push({t:'i',i:items.length-1}); return; }
      var ha=homoAuto(n,p);

/* ---------- Kit « Outils de classe partagés » : mes dictées et cycle (seulement si MODE_APP) ----------
   S.data.textes = [{id, t (titre), notion (règle), src (texte, paragraphes séparés par « ¶ »), mots:[], trous:[], date (dictée bilan, AAAA-MM-JJ)}]
   D (moteur) = S.data.textes avec n = rang + 1 ; S.data.mots[n] et S.data.ov[n] sont décalés quand on supprime ou déplace une dictée.
   S.data.cycle = {rythme:1|2 (semaines), etapes:[{id, on, nom, sem:-1|0|1, jour:1..5, devoir, bilan}]} */
var JOURS=["","lundi","mardi","mercredi","jeudi","vendredi"];
function cycleDefaut(){return {rythme:1,etapes:[
  {id:"mots",on:true,nom:"Découverte des mots",sem:0,jour:1,devoir:"Apprendre les mots de la dictée {n} : {mots}"},
  {id:"regle",on:true,nom:"Leçon : {regle}",sem:0,jour:2,devoir:"Revoir la règle : {regle}"},
  {id:"entr",on:true,nom:"Dictée d’entraînement",sem:0,jour:4,devoir:"Revoir les mots et la règle de la dictée {n}"},
  {id:"bilan",on:true,nom:"Dictée bilan n° {n}",sem:0,jour:5,devoir:"",bilan:true},
  {id:"corr",on:true,nom:"Correction de la dictée {n}",sem:1,jour:1,devoir:""}]}}
function kitPrep(){
  if(!Array.isArray(S.data.textes))S.data.textes=[];
  var c=S.data.cycle; if(!c||!Array.isArray(c.etapes))S.data.cycle=cycleDefaut();
  D=S.data.textes.map(function(x,i){return {n:i+1,t:x.t||("Dictée "+(i+1)),notion:x.notion||"",src:x.src||"",mots:Array.isArray(x.mots)?x.mots:[],gras:[]}});
  CYC={}; S.data.textes.forEach(function(x,i){ if(x.date) CYC[i+1]={dictee:x.date,mots:etapeDate(x.date,"mots")||"",regle:x.notion||""}; });
  PCACHE={};
}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function deIso(s){var p=String(s).split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function lundiDe(s){var d=deIso(s),j=(d.getDay()+6)%7;d.setDate(d.getDate()-j);return d}
function dateEtape(dBilan,e){var d=lundiDe(dBilan);d.setDate(d.getDate()+e.sem*7+(e.jour-1));return iso(d)}
function etapeDate(dBilan,id){var e=S.data.cycle.etapes.find(function(x){return x.id===id&&x.on});return e?dateEtape(dBilan,e):""}
function remplir(t,i){var x=S.data.textes[i], n=i+1, mots=(Array.isArray(S.data.mots[n])?S.data.mots[n]:x.mots||[]).slice(0,S.data.nbDefaut);
  return String(t||"").replace(/\{n\}/g,n).replace(/\{titre\}/g,x.t||"").replace(/\{regle\}/g,x.notion||"…").replace(/\{mots\}/g,mots.join(", ")||"…").replace(/\s+:\s*…$/,"");}
function etapesDu(jour){var out=[];S.data.textes.forEach(function(x,i){if(!x.date)return;S.data.cycle.etapes.forEach(function(e){if(e.on&&dateEtape(x.date,e)===jour)out.push({i:i,e:e,nom:remplir(e.nom,i),devoir:remplir(e.devoir,i)})})});return out}
function prochaineDate(){var T=S.data.textes, last=null; T.forEach(function(x){if(x.date&&(!last||x.date>last))last=x.date});
  var b=S.data.cycle.etapes.find(function(e){return e.bilan})||{jour:5,sem:0};
  if(last){var d=deIso(last);d.setDate(d.getDate()+7*(S.data.cycle.rythme||1));return iso(d)}
  var d2=new Date(), j=(d2.getDay()+6)%7+1; d2.setDate(d2.getDate()+((b.jour-j+7)%7||7)); return iso(d2);}
function nettoyer(s){return String(s||"").replace(/[{}#¶]/g,"").replace(/\r/g,"")}
function listeMots(s){return String(s||"").split(/[\n,;]+/).map(function(w){return w.trim()}).filter(Boolean)}
/* Décale mots et ov quand l'ordre des dictées change : ordre = anciens numéros dans le nouvel ordre */
function renumeroter(ordre){var m={},o={};ordre.forEach(function(ancien,k){if(ancien&&S.data.mots[ancien])m[k+1]=S.data.mots[ancien];if(ancien&&S.data.ov[ancien])o[k+1]=S.data.ov[ancien]});S.data.mots=m;S.data.ov=o;}
/* Mots à trous saisis dans l'éditeur → mots « à écrire sans l'apprendre » (état 'e') dans Préparer */
function appliquerTrous(n,trous,anciens){PCACHE={}; var set=new Set(trous.map(cle)), vieux=new Set((anciens||[]).map(cle)), o=Object.assign({},S.data.ov[n]||{});
  parse(n).forEach(function(ps){ps.forEach(function(p){if(p.t!=='w')return;var k=cle(p.w);if(set.has(k)){if(!o[p.key])o[p.key]='e'}else if(vieux.has(k)&&o[p.key]==='e')delete o[p.key]})});
  if(Object.keys(o).length)S.data.ov[n]=o;else delete S.data.ov[n];}

  var futur=[]; for(var k=1;k<=14;k++){var d=new Date();d.setDate(d.getDate()+k);var j=iso(d);etapesDu(j).forEach(function(x){futur.push({j:j,x:x})})}
  if(futur.length) h+='<details style="margin-top:8px"><summary class="small" style="cursor:pointer;font-weight:700">Les 2 prochaines semaines ('+futur.length+')</summary>'+futur.map(function(f){return '<p class="small" style="margin:4px 0">'+esc(fcourt(f.j))+' · <b>'+esc(f.x.nom)+'</b>'+(f.x.devoir?' · '+esc(f.x.devoir):'')+'</p>'}).join("")+'</details>';
  h+='</div><div class="card"><h2 style="margin-top:0">📚 Mes dictées <span class="muted small">· '+T.length+'</span></h2>';
  h+=T.map(function(x,i){return '<div class="drow"><span class="h">'+(i+1)+'</span><span class="t">'+esc(x.t||"Sans titre")+'<small>'+(x.notion?esc(x.notion)+' · ':'')+(x.mots&&x.mots.length?x.mots.length+' mots · ':'')+(x.date?'bilan '+esc(fcourt(x.date)):'sans date')+'</small></span>'
    +'<span class="row" style="gap:4px;flex-wrap:nowrap"><button class="btn sq sm" data-ka="haut" data-ki="'+i+'" aria-label="Monter" '+(i?'':'disabled')+'>↑</button><button class="btn sm" data-ka="edit" data-ki="'+i+'">✎ Modifier</button><button class="btn sm" data-ka="voir" data-ki="'+i+'">▶</button></span></div>'}).join("");
  h+='<div class="row" style="margin-top:10px"><button class="btn p" data-ka="ajout">＋ Ajouter une dictée</button></div>';
  h+='<details style="margin-top:12px"><summary class="small" style="cursor:pointer;font-weight:700">📤 Partager avec des collègues</summary><p class="small muted">Crée un fichier avec tes textes, mots et règles (sans élèves ni réglages), qu’un collègue importe ici. Ne partage que des textes que tu as le droit de diffuser.</p>'
    +'<div class="row"><button class="btn" data-ka="partager">📤 Créer le fichier</button><label class="btn">📥 Importer des dictées<input type="file" id="kimp" accept=".json,application/json" hidden></label></div></details></div>';
  var cycO=S.ui.cycOuvert===undefined?!T.length:S.ui.cycOuvert;
  h+='<details class="card" id="kcyc" '+(cycO?'open':'')+'><summary style="cursor:pointer;list-style:none"><h2 style="display:inline;margin:0">🔁 Mon cycle de dictée</h2> <span class="muted small">'+c.etapes.filter(function(e){return e.on}).length+' étapes · '+(c.rythme==2?'toutes les 2 semaines':'chaque semaine')+' ›</span></summary><p class="small muted">Coche tes étapes et place-les dans la semaine. {n} = numéro de la dictée, {mots} = mots à apprendre, {regle} = règle, {titre} = titre.</p>'
    +'<div class="hrow"><span>Une dictée bilan</span><select data-kc="rythme"><option value="1" '+(c.rythme==1?"selected":"")+'>chaque semaine</option><option value="2" '+(c.rythme==2?"selected":"")+'>toutes les 2 semaines</option></select></div>'
    +c.etapes.map(function(e,k){return '<div class="kstep" style="border-top:1px solid var(--line);padding:8px 0"><div class="row"><label><input type="checkbox" data-kc="on" data-ke="'+k+'" '+(e.on?"checked":"")+'> </label><input type="text" value="'+esc(e.nom)+'" data-kc="nom" data-ke="'+k+'" style="flex:1;min-width:160px" aria-label="Nom de l’étape"></div>'
      +'<div class="row" style="margin-top:6px"><select data-kc="sem" data-ke="'+k+'" aria-label="Semaine">'+[[-1,"semaine d’avant"],[0,"semaine de la dictée"],[1,"semaine d’après"]].map(function(o){return '<option value="'+o[0]+'" '+(e.sem==o[0]?"selected":"")+'>'+o[1]+'</option>'}).join("")+'</select>'
      +'<select data-kc="jour" data-ke="'+k+'" aria-label="Jour">'+[1,2,3,4,5].map(function(j){return '<option value="'+j+'" '+(e.jour==j?"selected":"")+'>'+JOURS[j]+'</option>'}).join("")+'</select>'+(e.bilan?'<small class="muted">← jour de la dictée bilan</small>':'<button class="btn sq sm danger" data-ka="delstep" data-ki="'+k+'" aria-label="Supprimer l’étape">🗑</button>')+'</div>'
      +(e.bilan?'':'<input type="text" value="'+esc(e.devoir)+'" data-kc="devoir" data-ke="'+k+'" placeholder="Devoirs ce jour-là (facultatif)" style="width:100%;margin-top:6px" aria-label="Devoirs">')+'</div>'}).join("")
    +'<div class="row" style="margin-top:8px"><button class="btn sm" data-ka="addstep">＋ Une étape</button><button class="btn sm" data-ka="cycdef">↺ Cycle proposé</button></div></details>';

function editer(i){
  var nouveau=i<0, x=nouveau?{t:"",notion:"",src:"",mots:[],trous:[],date:prochaineDate()}:S.data.textes[i];
  ouvrir('<h2 style="margin-top:0">'+(nouveau?"Nouvelle dictée":"Modifier la dictée "+(i+1))+'</h2>'
   +'<label class="small">Titre<input type="text" id="kT" value="'+esc(x.t)+'" style="width:100%" placeholder="Ex. Le château fort"></label>'
   +'<div class="row" style="margin-top:8px"><label class="small" style="flex:1">Règle travaillée (facultatif)<input type="text" id="kN" value="'+esc(x.notion)+'" style="width:100%" placeholder="Ex. a / à"></label><label class="small">Dictée bilan le<input type="date" id="kD" value="'+esc(x.date||"")+'"></label></div>'
   +'<label class="small" style="display:block;margin-top:8px">Texte de la dictée (une ligne vide = nouveau paragraphe)<textarea id="kS" rows="7" style="width:100%;font:inherit;border:2px solid var(--line);border-radius:12px;padding:8px" placeholder="Colle ou tape le texte">'+esc(String(x.src).split(" ¶ ").join("\n\n"))+'</textarea></label>'
   +'<div class="row" style="margin-top:8px;align-items:stretch"><label class="small" style="flex:1;min-width:180px">Mots à apprendre (un par ligne, ou séparés par des virgules)<textarea id="kM" rows="4" style="width:100%;font:inherit;border:2px solid var(--line);border-radius:12px;padding:8px">'+esc((x.mots||[]).join("\n"))+'</textarea></label>'
   +'<label class="small" style="flex:1;min-width:180px">Mots à trous, à écrire sans les apprendre (facultatif)<textarea id="kR" rows="4" style="width:100%;font:inherit;border:2px solid var(--line);border-radius:12px;padding:8px">'+esc((x.trous||[]).join("\n"))+'</textarea></label></div>'
   +'<p class="small muted">Ensuite, dans « Préparer », touche les mots du texte pour choisir ce que chaque élève écrit, apprend ou choisit. '+(nouveau?'':'Si tu changes le texte, les mots touchés dans « Préparer » pour cette dictée sont remis à zéro.')+'</p>'
   +'<div class="row end">'+(nouveau?'':'<button class="btn danger" id="kDel">🗑 Supprimer</button>')+'<button class="btn" id="kA">Annuler</button><button class="btn p" id="kO">Enregistrer</button></div>');
  $("#kA").onclick=fermer;
  if(!nouveau)$("#kDel").onclick=function(){fermer();setTimeout(function(){confirmer("Supprimer la dictée « "+(x.t||(i+1))+" » et les mots préparés pour elle ?","Supprimer",function(){
    var ordre=S.data.textes.map(function(_,k){return k+1}); ordre.splice(i,1); S.data.textes.splice(i,1); renumeroter(ordre); kitPrep(); S.ui.cur=Math.max(0,Math.min(S.ui.cur,S.data.textes.length-1)); modifier(); rendre(); toast("Dictée supprimée · Ctrl+Z pour annuler")})},60)};
  $("#kO").onclick=function(){
    var src=nettoyer($("#kS").value).split(/\n\s*\n/).map(function(p){return p.replace(/\s*\n\s*/g," ").trim()}).filter(Boolean).join(" ¶ ");
    if(!src){toast("Écris ou colle le texte de la dictée");$("#kS").focus();return}
    var neuf={id:x.id||("d"+Date.now().toString(36)),t:nettoyer($("#kT").value).trim(),notion:nettoyer($("#kN").value).trim(),src:src,mots:listeMots($("#kM").value),trous:listeMots($("#kR").value),date:$("#kD").value||""};
    var n=nouveau?S.data.textes.length+1:i+1;
    if(nouveau)S.data.textes.push(neuf); else { if(neuf.src!==x.src)delete S.data.ov[n]; if(JSON.stringify(neuf.mots)!==JSON.stringify(x.mots))delete S.data.mots[n]; S.data.textes[i]=neuf; }
    kitPrep(); appliquerTrous(n,neuf.trous,nouveau||neuf.src!==x.src?[]:x.trous);
    if(nouveau)S.ui.cur=n-1; fermer(); modifier(); rendre(); toast(nouveau?"Dictée ajoutée":"Dictée enregistrée");
  };

function importer(f){f.text().then(function(t){var d=JSON.parse(t);confirmer("Remplacer tous tes réglages de dictées (élèves, listes de mots, dictées faites, notions) par ceux du fichier ?","Remplacer",function(){S.data=migrer(d);modifier();appliquerTheme();rendre();toast("Réglages restaurés")})}).catch(function(){toast("Fichier illisible")})}

/* ---------- mode élève (en ligne) ---------- */
var EV=null;
function ouvrirEleve(){
  var n=S.ui.cur+1,pour=S.ui.pour, c=construire(n,profil(pour)), k=n+":"+pour;
  var st=S.ui.rep[k]; if(!st||st.sig!==c.items.length+"|"+c.items.map(function(i){return i.key}).join(","))st={c:{},b:{},done:false,sig:c.items.length+"|"+c.items.map(function(i){return i.key}).join(",")};
  EV={n:n,pour:pour,c:c,k:k,st:st};
  $("#eleve").classList.add("on"); document.body.style.overflow="hidden"; history.pushState({eleve:1},""); dessinerEleve(); $("#eleve").scrollTop=0;
}
function dessinerEleve(){
  var n=EV.n,c=EV.c,st=EV.st,d=D[n-1],nom=nomPour(EV.pour),r=rang(n);
  $("#eleve").innerHTML='<div class="wrap"><div class="row" style="justify-content:space-between;margin-bottom:10px"><span class="muted small">'+(r%1?"Dictée":"Dictée "+r)+(nom?" · "+esc(nom):"")+'</span><button class="btn" id="quit"><i></i>✕ Quitter (enseignant : garde appuyé)</button></div>'
   +'<div class="sheet '+(st.done?"done":"")+'"><h1>'+(r%1?"":"Dictée "+r+" – ")+esc(d.t)+'</h1>'
   +'<div class="help"><span class="d" aria-hidden="true"><span>an</span><span class="on">ans</span></span><span>Je touche le mot bien écrit. Il devient bleu foncé.</span><span class="g" aria-hidden="true"></span><span>J’écris le mot dans le cadre.</span></div>'
   +'<div class="dtext">'+htmlParas(clone(c),function(it,i){return it.type==='c'
      ?'<span class="grp" role="group" aria-label="Choix" data-i="'+i+'">'+it.opts.map(function(o,j){return '<button type="button" class="opt" data-i="'+i+'" data-j="'+j+'" aria-pressed="'+(st.c[i]===j)+'">'+esc(o)+'</button>'}).join("")+'</span>'
      :'<span class="gw"><input class="gap'+(it.src!=='L'?' e':'')+'" data-i="'+i+'" style="width:'+Math.max(4,it.ok.length*.7+1.6)+'em" aria-label="Mot à écrire" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" value="'+esc(st.b[i]||"")+'"><small></small></span>'})+'</div>'
   +'<div class="row"><button class="btn p" id="fin" '+(st.done?"hidden":"")+'>J’ai terminé</button><button class="btn" id="raz">Recommencer</button><span id="emsg" class="small" style="color:var(--ko)"></span></div>'
   +'<div class="score" id="score" '+(st.done?"":"hidden")+'></div></div></div>';
  document.querySelectorAll("#eleve .opt").forEach(function(b){b.onclick=function(){if(EV.st.done)return;var i=+b.dataset.i,j=+b.dataset.j;EV.st.c[i]=j;garderEleve();document.querySelectorAll('#eleve .opt[data-i="'+i+'"]').forEach(function(o){o.setAttribute("aria-pressed",+o.dataset.j===j)})}});
  document.querySelectorAll("#eleve .gap").forEach(function(g){g.readOnly=st.done;g.oninput=function(){EV.st.b[g.dataset.i]=g.value;garderEleve()}});
  $("#fin").onclick=terminer;
  $("#raz").onclick=function(){ouvrir('<p style="margin-top:0">Effacer toutes les réponses de cette dictée ?</p><div class="row end"><button class="btn" id="cA">Non</button><button class="btn p" id="cO">Oui, effacer</button></div>');$("#cA").onclick=fermer;$("#cO").onclick=function(){fermer();EV.st={c:{},b:{},done:false,sig:EV.st.sig};garderEleve();dessinerEleve()}};
  var q=$("#quit"),t=null;
  q.onpointerdown=function(){q.classList.add("hold");t=setTimeout(function(){fermerEleve()},1500)};
  function stop(){q.classList.remove("hold");clearTimeout(t)} q.onpointerup=stop;q.onpointerleave=stop;q.onpointercancel=stop;
  q.onclick=function(e){e.preventDefault(); $("#emsg").textContent="Pour quitter, l’enseignant garde le doigt appuyé sur « Quitter »."};
  q.onkeydown=function(e){if(e.key==="Enter"&&e.shiftKey)fermerEleve()};
  if(st.done)corriger();
}
function garderEleve(){S.ui.rep[EV.k]=EV.st;sauverLocal()}
function norm(s){return (s||"").trim().replace(/'/g,"’").replace(/\s+/g," ")}
function terminer(){
  var vides=EV.c.items.filter(function(it,i){return it.type==='c'?EV.st.c[i]===undefined:!norm(EV.st.b[i])}).length;
  if(vides&&!EV.prev){$("#emsg").textContent="Il reste "+vides+" case"+(vides>1?"s":"")+" vide"+(vides>1?"s":"")+". Relis, puis touche encore « J’ai terminé ».";EV.prev=1;return}
  EV.prev=0; EV.st.done=true; garderEleve(); dessinerEleve(); $("#score").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function corriger(){
  var ok=0,tot=EV.c.items.length;
  EV.c.items.forEach(function(it,i){
    if(it.type==='c'){var sel=EV.st.c[i]; if(sel===it.ok)ok++; if(sel===undefined)document.querySelector('#eleve .grp[data-i="'+i+'"]').classList.add("miss");
      document.querySelectorAll('#eleve .opt[data-i="'+i+'"]').forEach(function(o){var j=+o.dataset.j;o.classList.toggle("good",j===it.ok);o.classList.toggle("bad",j===sel&&j!==it.ok);o.disabled=true});}
    else {var g=document.querySelector('#eleve .gap[data-i="'+i+'"]'),good=norm(EV.st.b[i])===norm(it.ok);if(good)ok++;g.classList.toggle("good",good);g.classList.toggle("bad",!good);g.nextElementSibling.textContent=good?"":it.ok;}
  });
  var pc=tot?Math.round(ok*100/tot):0;
  $("#score").innerHTML='<strong>Mots réussis : '+ok+' / '+tot+'</strong><br>Réussite : <strong>'+pc+' %</strong><br><span class="small muted">'+tot+' mots à écrire ou à choisir : '+EV.c.nB+' à écrire, '+EV.c.nC+' à choisir.</span>';
}
function fermerEleve(viaRetour){ $("#eleve").classList.remove("on");$("#eleve").innerHTML="";document.body.style.overflow="";EV=null; if(!viaRetour&&history.state&&history.state.eleve){skipPop++;history.back()} }

/* ---------- pages A4 ---------- */
function titreDictee(n){var r=rang(n);return (r%1?"":"Dictée "+r+" – ")+D[n-1].t}
function tete(n,droite){return '<div class="ph"><b>'+esc(titreDictee(n))+'</b><span>'+(droite||"")+'</span></div>'}

  var c=construire(n,profil(pour)), nom=nomPour(pour);
  var corps=htmlParas(clone(c),function(it){return it.type==='c'?'<span class="pg">'+it.opts.map(function(o){return '<i>'+esc(o)+'</i>'}).join("")+'</span>':'<span class="pz" style="width:'+Math.max(3.2,it.ok.length*.6+1)+'em"></span>'});
  return '<div class="page fiche">'+tete(n,"Dictée adaptée")
   +'<div class="who"><span>Prénom : '+(nom?'<b>'+esc(nom)+'</b>':"……………………………")+'</span><span>Date : ………………………</span></div>'
   +'<div class="cons"><span class="d"><i>an</i><i>ans</i></span><span>J’entoure le mot bien écrit.</span><span class="g"></span><span>J’écris le mot dans le cadre.</span><span>À la fin, je relis chaque phrase.</span></div>'
   +'<div class="pt">'+corps+'</div>'

function pagesBandeaux(n,qui){
  var liste=qui==="tous"?S.data.eleves.map(function(e){return e.id}):Array(S.data.copies).fill(qui);
  function ban(p){var m=motsDe(n).slice(0,nbPour(p)),nom=nomPour(p);return '<div class="ban"><div class="bh"><span><b>Mes mots à apprendre</b> · '+esc(titreDictee(n))+'</span><span>'+(nom?esc(nom):"")+'</span></div><div class="bw">'+m.map(function(w){return '<span>'+esc(w)+'</span>'}).join("")+'</div></div>'}
  var pages=[];for(var i=0;i<liste.length;i+=4)pages.push('<div class="page">'+liste.slice(i,i+4).map(ban).join("")+'</div>');return pages;
}
function pagesEtiquettes(n,pour){var m=motsDe(n).slice(0,nbPour(pour)),nom=nomPour(pour),pages=[];
  for(var i=0;i<m.length;i+=8)pages.push('<div class="page">'+tete(n,nom?esc(nom):"Étiquettes-mots")+'<div class="eti">'+m.slice(i,i+8).map(function(w){return '<div>'+esc(w)+'</div>'}).join("")+'</div></div>');return pages}
function pageCorrige(n){
  var tous=motsDe(n), c=construire(n,{nb:tous.length,det:true,pro:true});
  var lis=c.items.map(function(it){return it.type==='c'?'<li><b>'+esc(it.opts[it.ok])+'</b> <span style="color:#5B6878">('+(it.cat==='homo'&&it.notion?it.notion:CATS[it.cat]||it.cat)+')</span></li>':'<li><b>'+esc(it.ok)+'</b> <span style="color:'+(it.src==='L'?'#9A7B00':'#B45309')+'">('+({e:"à écrire",d:"déterminant",p:"pronom"}[it.src]||"mot appris n° "+it.rang)+')</span></li>'}).join("");
  var groupes=(baseOn()?[["Fiche sans prénom",profil("base")]]:[]).concat(S.data.eleves.map(function(e){return [e.prenom||"?",profil(e.id)]}));
  var totaux=[]; groupes.forEach(function(g){var T=construire(n,g[1]).total; if(totaux.indexOf(T)<0)totaux.push(T)}); totaux.sort(function(a,b){return a-b});
  var tab=totaux.map(function(T){var rows=[],cells=[];for(var k=0;k<=T;k++)cells.push(k);for(var i=0;i<cells.length;i+=14)rows.push(cells.slice(i,i+14));
    return '<p style="margin:10px 0 4px;font-size:14px"><b>Sur '+T+'</b> :</p><table class="bar2">'+rows.map(function(r){return '<tr>'+r.map(function(k){return '<td><b>'+k+'</b><br>'+Math.round(k*100/T)+' %</td>'}).join("")+'</tr>'}).join("")+'</table>'}).join("");
  return '<div class="page">'+tete(n,"Corrigé et barème · enseignant")
   +'<p style="font-size:14px;margin:0 0 6px">Dicter les bandes jaune et verte en entier. 1 point par mot juste. Un élève qui apprend moins de mots a les suivants écrits sur sa fiche ; de même pour les déterminants et les pronoms si l’option est retirée. Réponses dans l’ordre du texte, avec toutes les options :</p>'
   +'<ol class="cor">'+lis+'</ol>'
   +'<table style="font-size:14px;margin-top:10px"><tr><th>Pour</th><th>Mots appris</th><th>Total</th></tr>'+groupes.map(function(g){return '<tr><td>'+esc(g[0])+'</td><td>'+g[1].nb+' : '+esc(tous.slice(0,g[1].nb).join(", "))+(g[1].det||g[1].pro?'<br><small>+ '+[g[1].det?"déterminants":"",g[1].pro?"pronoms sujets":""].filter(Boolean).join(" et ")+' à écrire</small>':'')+'</td><td>'+construire(n,g[1]).total+'</td></tr>'}).join("")+'</table>'+tab+'</div>';
}
function pagesPeriode(k,qui){
  var ds=dicteesPeriode(k), pers=qui==="tous"?S.data.eleves.map(function(e){return e.id}):[qui];
  return pers.map(function(p){var nom=nomPour(p),nb=nbPour(p);
    return '<div class="page"><div class="ph"><b>Mes mots à apprendre · Période '+k+'</b><span>'+(nom?esc(nom):"")+'</span></div><table style="font-size:20px">'
     +ds.map(function(d){return '<tr><td style="width:36%;font-size:15px;color:#5B6878">Dictée '+rang(d.n)+'<br>'+esc(d.t)+'</td><td style="line-height:1.9">'+motsDe(d.n).slice(0,nb).map(function(w){return '<span style="background:#FFF6CC;border-radius:8px;padding:1px 8px;margin-right:6px;white-space:nowrap">'+esc(w)+'</span>'}).join(" ")+'</td></tr>'}).join("")+'</table></div>'});

async function versPdf(pages,filename){
  if(!pages.length){toast("Rien à imprimer");return}
  if(!window.html2canvas||!window.jspdf){toast("Les outils PDF ne se sont pas chargés. Vérifie la connexion puis réessaie.");return}
  ouvrir('<h2 style="margin-top:0">Préparation du PDF…</h2><p class="muted" id="pp">0 / '+pages.length+'</p>',true);
  try{ await document.fonts.ready; }catch(e){}
  var zone=$("#printzone"), jsPDF=window.jspdf.jsPDF, pdf=new jsPDF({unit:"mm",format:"a4"}), imgs=[];
  try{
    for(var i=0;i<pages.length;i++){
      zone.innerHTML=pages[i]; var pg=zone.firstElementChild; ajuster(pg);
      var cv=await html2canvas(pg,{scale:2,backgroundColor:"#ffffff",width:794,height:1123,windowWidth:900});
      var url=cv.toDataURL("image/jpeg",.85); if(i)pdf.addPage(); pdf.addImage(url,"JPEG",0,0,210,297); imgs.push(url);
      var pp=$("#pp"); if(pp)pp.textContent=(i+1)+" / "+pages.length;
    }
  }catch(e){ zone.innerHTML=""; $("#dlg").innerHTML='<p style="margin-top:0">Le PDF n’a pas pu être préparé.</p><div class="row end"><button class="btn" id="cA">Fermer</button><button class="btn p" id="cR">Réessayer</button></div>';$("#ov").dataset.b="";$("#cA").onclick=fermer;$("#cR").onclick=function(){fermer();versPdf(pages,filename)};return }
  zone.innerHTML="";
  var blob=pdf.output("blob"); $("#ov").dataset.b="";
  $("#dlg").style.maxWidth="820px";
  $("#dlg").innerHTML='<div class="row" style="justify-content:space-between;margin:0 0 10px"><b>'+pages.length+' page'+(pages.length>1?"s":"")+'</b><span class="row" style="margin:0"><button class="btn" id="pF">Fermer</button><button class="btn p" id="pD">⬇ Télécharger le PDF</button></span></div><div id="prev"><div class="imgs">'+imgs.map(function(u,i){return '<img src="'+u+'" alt="Page '+(i+1)+'">'}).join("")+'</div></div>';
  $("#pF").onclick=fermer;
  $("#pD").onclick=async function(){if(await enregistrer(filename,blob))toast("PDF enregistré")};
}
function ajuster(pg){ var pt=pg.querySelector(".pt"); if(!pt)return; var fs=22; pt.style.setProperty("--fs",fs+"px");
  while(pt.scrollHeight>pt.clientHeight+1&&fs>13){fs-=.5;pt.style.setProperty("--fs",fs+"px")} }
function slug(t){return t.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]+/g,"_").replace(/^_|_$/g,"")}
function quiValide(){pourOk();return S.ui.qui}
function pdfDictee(){
  var n=S.ui.cur+1, qui=quiValide(), docs=S.ui.docs||{fiche:true,ban:true,eti:false,cor:true};
  if(!docs.fiche&&!docs.ban&&!docs.eti&&!docs.cor){toast("Choisis au moins un document");return}
  var pers=qui==="tous"?S.data.eleves.map(function(e){return e.id}):[qui], pages=[];
  if(docs.fiche)pers.forEach(function(p){pages.push(pageFiche(n,p))});
  if(docs.ban)pages=pages.concat(pagesBandeaux(n,qui));
  if(docs.eti)pers.forEach(function(p){pages=pages.concat(pagesEtiquettes(n,p))});
  if(docs.cor)pages.push(pageCorrige(n));
  var qn=qui==="tous"?"classe":qui==="base"?"base":slug(nomPour(qui)||"eleve"), r=rang(n);
  versPdf(pages,"Dictee"+(r%1?"_n"+n:String(r).padStart(2,"0"))+"_"+slug(D[n-1].t)+"_"+qn+".pdf");
}
function pdfPeriode(k){var qui=quiValide(); versPdf(pagesPeriode(k,qui),"Mots_periode"+k+"_"+(qui==="tous"?"classe":qui==="base"?"base":slug(nomPour(qui)||"eleve"))+".pdf")}

async function demarrer(){
  if(MODE_APP){ kitPrep(); } else
  try{ var r=await fetch("dictees-adaptees.json"); if(!r.ok)throw 0; var j=await r.json(); D=j.dictees; }
  catch(e){ $("#app").innerHTML='<div class="card"><p>Les dictées n’ont pas pu être chargées.</p><button class="btn p" onclick="location.reload()">Réessayer</button> <a class="btn" href="index.html">← Classe</a></div>'; return; }
  S.ui.cur=Math.max(0,Math.min(D.length-1,+S.ui.cur||0)); S.ui.choisi=0;
  var h=location.hash.slice(1), m=h.match(/^([di])(\d+)(?:-(\w+))?$/);
  if(m){var f=faites(), n=f[+m[2]-1]; if(n){S.ui.cur=n-1;S.ui.choisi=1;} S.ui.tab=m[1]==="i"?"imprimer":"dictee";
    if(m[1]==="i"){S.ui.qui="tous"; S.ui.docs=m[3]==="ban"?{ban:true}:{fiche:true,cor:true};} sauverLocal();}
  else if(VUES[h])S.ui.tab=h;
  if(MODE_APP&&!D.length)S.ui.tab="textes";
  history.replaceState({tab:S.ui.tab},"","#"+S.ui.tab);
  HIST.last=JSON.stringify(S.data); appliquerTheme(); rendre(); if(L.abime)toast("Réglages illisibles sur cet appareil : copie de secours gardée");
  initSync();
}
document.addEventListener("keydown",function(e){
  if($("#eleve").classList.contains("on"))return;
  var t=e.target, saisie=t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.tagName==="SELECT"||t.isContentEditable), ctrl=e.ctrlKey||e.metaKey, k=e.key.toLowerCase();
  if(e.key==="Escape"&&$("#ov").classList.contains("on")&&!$("#ov").dataset.b){e.preventDefault();fermer();return}
  if(saisie||$("#ov").classList.contains("on")||document.getElementById("kproj"))return;
  if(ctrl&&k==="z"&&!e.shiftKey){e.preventDefault();annuler();return}
  if(ctrl&&(k==="y"||(k==="z"&&e.shiftKey))){e.preventDefault();refaire();return}
  if(ctrl||e.altKey)return;
  if(e.key==="ArrowLeft"||e.key==="ArrowRight"){var b=document.querySelector('[data-act="'+(e.key==="ArrowLeft"?"prev":"next")+'"]'); if(b){e.preventDefault();b.click()} return}
  if(S.ui.tab==="mots"&&/^[1-4]$/.test(e.key)){S.ui.brush=BR[+e.key-1][0];sauverLocal();rafraichir();return}
  if(k==="d"||k==="p"||k==="i"||k==="r"){var tb={d:"dictee",p:"mots",i:"imprimer",r:"reglages"}[k];aller(tb);}
});
addEventListener("hashchange",function(){var m=location.hash.match(/^#d(\d+)$/); if(!m||!D.length)return; var n=faites()[+m[1]-1]; if(n){S.ui.cur=n-1;S.ui.choisi=1;S.ui.tab="dictee";sauverLocal();history.replaceState({tab:"dictee"},"","#dictee");rendre();window.scrollTo(0,0)}});
demarrer();
